<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة إدارة الأصناف - أبو طارق</title>
<style>
body{font-family:Tahoma,Arial,sans-serif;background:#f5f5f5;margin:0;color:#222}.wrap{width:min(1050px,94%);margin:30px auto}.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 5px 20px #0000000d}.head{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.head img{height:60px}.btn{border:0;border-radius:10px;padding:10px 15px;font-weight:700;cursor:pointer}.primary{background:#d71920;color:#fff}.green{background:#16a34a;color:#fff}.gray{background:#eee}.danger{background:#fee2e2;color:#991b1b}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{font-weight:700}input,select,textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:9px;margin-top:5px;font:inherit}textarea{min-height:90px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.item{display:grid;grid-template-columns:90px 1fr auto;gap:12px;align-items:center;border-top:1px solid #eee;padding:12px 0}.item img{width:90px;height:90px;object-fit:cover;border-radius:10px;background:#eee}.muted{color:#777;font-size:14px}.hidden{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}.item{grid-template-columns:70px 1fr}.item .actions{grid-column:1/-1}.item img{width:70px;height:70px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card head">
    <div><img src="assets/logo.png" alt="أبو طارق"><h1>لوحة إدارة الأصناف</h1><p class="muted">إضافة وحذف وإخفاء الأصناف بسهولة. النسخة الجاهزة للربط مع Google Sheets.</p></div>
    <a class="btn gray" href="index.html">عرض الموقع</a>
  </div>

  <div class="card">
    <h2>إعداد الاتصال</h2>
    <p>ضع رابط Google Apps Script في خانة DATA_URL داخل ملف <b>app.js</b> للموقع. بعد ربط Google Sheets نقدر نخلي الإضافة والحذف من هنا مباشرة.</p>
    <div class="grid">
      <label>رابط Google Apps Script
        <input id="api" placeholder="https://script.google.com/macros/s/.../exec">
      </label>
      <label>مفتاح الإدارة
        <input id="key" type="password" placeholder="المفتاح الذي ستضعه في Apps Script">
      </label>
    </div>
    <button class="btn green" onclick="saveSettings()">حفظ الإعدادات على هذا الجهاز</button>
  </div>

  <div class="card">
    <h2>إضافة صنف</h2>
    <div class="grid">
      <label>اسم الصنف<input id="name"></label>
      <label>القسم<select id="category"></select></label>
      <label>رابط الصورة<input id="image" placeholder="رابط صورة مباشرة"></label>
      <label>وصف قصير<input id="description"></label>
    </div>
    <div class="row" style="margin-top:12px"><button class="btn primary" onclick="addProduct()">إضافة الصنف</button><span id="msg" class="muted"></span></div>
  </div>

  <div class="card">
    <h2>الأصناف الحالية</h2>
    <div id="list"></div>
  </div>
</div>
<script>
const cats=["السفرة","الشاي والقهوة","الأكواب والكاسات","المطبخ","أواني الطهي","الميلامين"];
let products=JSON.parse(localStorage.getItem("demoProducts")||"[]");
document.getElementById("category").innerHTML=cats.map(c=>`<option>${c}</option>`).join("");
function settings(){return {api:localStorage.getItem("api")||"",key:localStorage.getItem("key")||""}}
document.getElementById("api").value=settings().api;document.getElementById("key").value=settings().key;
function saveSettings(){localStorage.setItem("api",api.value.trim());localStorage.setItem("key",key.value.trim());msg.textContent="تم حفظ الإعدادات على هذا الجهاز.";setTimeout(()=>msg.textContent="",2500)}
function draw(){list.innerHTML=products.length?products.map((p,i)=>`<div class="item"><img src="${p.image||''}" onerror="this.style.display='none'"><div><b>${p.name}</b><div class="muted">${p.category} — ${p.description||''}</div></div><div class="actions"><button class="btn danger" onclick="removeProduct(${i})">حذف</button></div></div>`).join(""):"<p class='muted'>لا توجد أصناف محلية حتى الآن.</p>"}
async function addProduct(){
 const p={name:name.value.trim(),category:category.value,image:image.value.trim(),description:description.value.trim(),active:true};
 if(!p.name)return alert("اكتب اسم الصنف");
 products.unshift(p);localStorage.setItem("demoProducts",JSON.stringify(products));draw();
 const s=settings();
 if(s.api){try{await fetch(s.api,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"add",key:s.key,product:p})});msg.textContent="تم إرسال الصنف للسيرفر."}catch(e){msg.textContent="اتحفظ محليًا، لكن تعذر الاتصال بالسيرفر."}}
 name.value=image.value=description.value="";
}
function removeProduct(i){if(confirm("متأكد إنك عايز تحذف الصنف؟")){products.splice(i,1);localStorage.setItem("demoProducts",JSON.stringify(products));draw()}}
draw();
</script>
</body>
</html>
