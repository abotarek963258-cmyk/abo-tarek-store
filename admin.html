<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة إدارة أبو طارق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f4f1ea;color:#18283b;font-family:Cairo,Tahoma,sans-serif}.wrap{width:min(850px,92%);margin:40px auto}.box{background:#fff;border-radius:20px;padding:25px;box-shadow:0 10px 35px #18283b12;margin-bottom:18px}h1{margin-top:0}label{display:block;font-weight:700;margin:12px 0 6px}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d8d1c5;border-radius:10px;font:inherit}textarea{min-height:90px}button{border:0;border-radius:10px;padding:11px 18px;font:inherit;font-weight:800;cursor:pointer;background:#182f48;color:#fff;margin-top:14px}.danger{background:#b42318}.muted{color:#687583;font-size:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:600px){.row{grid-template-columns:1fr}}.item{border-top:1px solid #eee;padding:15px 0;display:flex;justify-content:space-between;gap:15px}.status{margin-top:12px;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <div class="box">
    <h1>لوحة إدارة الأصناف</h1>
    <p class="muted">دي لوحة الإدارة المرتبطة بجدول Google Sheets. الأسعار مش موجودة.</p>
    <label>رابط الـ Web App</label>
    <input id="api" value="https://script.google.com/macros/s/AKfycbyw7k-K9akpV08vSjXbDmZ8khpHH9LOq2G9WLDHT2-iOJiTThN-kvEaCKI0-wKWu7hY/exec">
    <label>مفتاح الإدارة</label>
    <input id="key" type="password" placeholder="اكتب مفتاح الإدارة">
  </div>
  <div class="box">
    <h2>إضافة صنف</h2>
    <div class="row">
      <div><label>اسم الصنف</label><input id="name"></div>
      <div><label>القسم</label><select id="category">
        <option>السفرة</option><option>الشاي والقهوة</option><option>الأكواب والكاسات</option><option>المطبخ</option><option>أواني الطهي</option><option>الميلامين</option>
      </select></div>
    </div>
    <label>رابط صورة الصنف (اختياري)</label><input id="image">
    <label>وصف مختصر (اختياري)</label><textarea id="description"></textarea>
    <button onclick="addProduct()">إضافة الصنف</button>
    <div id="status" class="status"></div>
  </div>
  <div class="box">
    <h2>الأصناف الحالية</h2>
    <div id="list" class="muted">جاري التحميل...</div>
  </div>
</div>
<script>
const api=document.getElementById("api"), key=document.getElementById("key"), statusEl=document.getElementById("status"), list=document.getElementById("list");
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
async function load(){
  try{
    const r=await fetch(api.value,{cache:"no-store"}); const data=await r.json();
    list.innerHTML=data.length?data.map(p=>`<div class="item"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.category||"")}</div></div><button class="danger" onclick="removeProduct('${esc(p.id)}')">حذف</button></div>`).join(""):"لا توجد أصناف حاليًا.";
  }catch(e){list.textContent="تعذر تحميل الأصناف."}
}
async function addProduct(){
  statusEl.textContent="جاري الإضافة...";
  const product={name:document.getElementById("name").value.trim(),category:document.getElementById("category").value,image:document.getElementById("image").value.trim(),description:document.getElementById("description").value.trim()};
  if(!product.name){statusEl.textContent="اكتب اسم الصنف أولًا.";return;}
  const r=await fetch(api.value,{method:"POST",body:JSON.stringify({action:"add",key:key.value,product})});
  const d=await r.json(); statusEl.textContent=d.ok?"تمت إضافة الصنف.":"حصلت مشكلة: "+(d.error||"غير معروف");
  if(d.ok){document.getElementById("name").value="";document.getElementById("image").value="";document.getElementById("description").value="";load();}
}
async function removeProduct(id){
  if(!confirm("متأكد إنك عايز تحذف الصنف؟")) return;
  const r=await fetch(api.value,{method:"POST",body:JSON.stringify({action:"delete",key:key.value,id})});
  const d=await r.json(); statusEl.textContent=d.ok?"تم الحذف.":"حصلت مشكلة: "+(d.error||"غير معروف"); load();
}
load();
</script>
</body>
</html>
