<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>الأقسام والأصناف | أبو طارق للأدوات المنزلية</title>

  <meta
    name="description"
    content="تصفح جميع أقسام وأصناف أبو طارق للأدوات المنزلية، وابحث عن المنتج وتواصل معنا مباشرة عبر واتساب."
  >

  <meta name="theme-color" content="#10243d">

  <link rel="icon" href="./assets/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <style>
    :root{
      --navy:#10243d;
      --navy2:#173653;
      --gold:#c9a45b;
      --gold2:#d9b970;
      --green:#148b57;

      --bg:#f7f4ee;
      --text:#17283b;
      --muted:#74808b;
      --white:#fff;
      --border:#e7e0d6;

      --shadow:0 16px 45px rgba(16,36,61,.10);
      --r:22px;
    }

    *{
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:Cairo,Arial,sans-serif;
    }

    button,
    input{
      font-family:inherit;
    }

    a{
      -webkit-tap-highlight-color:transparent;
    }

    .container{
      width:min(1180px,calc(100% - 32px));
      margin:auto;
    }

    /* =========================
       HEADER
    ========================= */

    .header{
      position:sticky;
      top:0;
      z-index:50;

      background:rgba(16,36,61,.96);
      backdrop-filter:blur(12px);

      box-shadow:0 8px 28px rgba(0,0,0,.12);
    }

    .nav{
      min-height:76px;

      display:flex;
      align-items:center;
      gap:18px;
    }

    .brand{
      display:flex;
      align-items:center;

      text-decoration:none;
      flex-shrink:0;
    }

    .brand img{
      width:150px;
      height:auto;
      display:block;
    }

    .navlinks{
      display:flex;
      align-items:center;
      gap:7px;
      margin-right:auto;
    }

    .navlinks a,
    .wa{
      color:#fff;
      text-decoration:none;

      padding:10px 13px;
      border-radius:12px;

      font-weight:800;
      transition:.2s ease;
    }

    .navlinks a:hover{
      background:rgba(255,255,255,.10);
      color:var(--gold2);
    }

    .wa{
      background:var(--green);
      padding-inline:17px;
    }

    .wa:hover{
      transform:translateY(-1px);
      filter:brightness(1.08);
    }

    /* =========================
       HERO
    ========================= */

    .hero{
      padding:60px 0 28px;

      background:
        radial-gradient(
          circle at 12% 20%,
          rgba(201,164,91,.18),
          transparent 28%
        ),
        linear-gradient(
          135deg,
          var(--navy),
          var(--navy2)
        );

      color:#fff;
    }

    .hero-overline{
      color:var(--gold2);
      font-weight:800;
      letter-spacing:.2px;
    }

    .hero h1{
      font-size:clamp(32px,5vw,54px);
      line-height:1.25;
      margin:10px 0;
    }

    .hero p{
      max-width:720px;

      color:rgba(255,255,255,.78);

      font-size:17px;
      line-height:1.9;
      margin:0;
    }

    .stats{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      margin-top:22px;
    }

    .stat{
      padding:11px 15px;

      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.07);

      border-radius:14px;
    }

    .stat b{
      display:block;
      font-size:22px;
      color:var(--gold2);
    }

    /* =========================
       CATALOG
    ========================= */

    .catalog{
      padding:18px 0 70px;
    }

    .toolbar{
      margin:24px 0;

      display:flex;
      gap:12px;
      align-items:center;
    }

    .search{
      flex:1;
      position:relative;
    }

    .search input{
      width:100%;
      height:54px;

      border:1px solid var(--border);
      border-radius:16px;

      padding:0 18px;

      font-size:15px;
      outline:none;

      background:#fff;

      box-shadow:var(--shadow);

      transition:.2s ease;
    }

    .search input:focus{
      border-color:rgba(201,164,91,.75);

      box-shadow:
        0 0 0 4px rgba(201,164,91,.10),
        var(--shadow);
    }

    .search button{
      position:absolute;

      left:8px;
      top:8px;

      height:38px;

      border:0;
      border-radius:11px;

      padding:0 13px;

      background:#f0ece5;

      color:var(--navy);

      font-weight:800;

      cursor:pointer;
    }

    /* =========================
       CATEGORIES
    ========================= */

    .categories{
      display:grid;

      grid-template-columns:
        repeat(auto-fit,minmax(160px,1fr));

      gap:12px;
    }

    .cat{
      border:1px solid var(--border);

      background:#fff;

      border-radius:18px;

      padding:17px;

      text-align:right;

      cursor:pointer;

      box-shadow:
        0 6px 20px rgba(16,36,61,.05);

      transition:.2s ease;

      color:var(--text);
    }

    .cat:hover,
    .cat.active{
      transform:translateY(-2px);

      border-color:
        rgba(201,164,91,.65);

      box-shadow:var(--shadow);
    }

    .cat .icon{
      font-size:28px;
    }

    .cat strong{
      display:block;
      margin-top:6px;
    }

    .cat small{
      color:var(--muted);
    }

    /* =========================
       SELECTED CATEGORY
    ========================= */

    .selected{
      display:flex;

      justify-content:space-between;
      align-items:center;

      gap:15px;

      background:#fff;

      border:1px solid var(--border);

      border-radius:18px;

      padding:16px 18px;

      margin:22px 0;
    }

    .selected strong{
      color:var(--navy);
    }

    .selected button{
      border:0;

      background:#f0ece5;

      color:var(--navy);

      border-radius:10px;

      padding:9px 13px;

      font-weight:800;

      cursor:pointer;
    }

    .selected button:hover{
      background:#e8dfd1;
    }

    /* =========================
       PRODUCTS
    ========================= */

    .grid{
      display:grid;

      grid-template-columns:
        repeat(4,minmax(0,1fr));

      gap:18px;
    }

    .card{
      background:#fff;

      border:1px solid var(--border);

      border-radius:20px;

      overflow:hidden;

      box-shadow:
        0 8px 26px rgba(16,36,61,.06);

      display:flex;
      flex-direction:column;

      transition:.25s ease;
    }

    .card:hover{
      transform:translateY(-4px);

      box-shadow:
        0 18px 45px rgba(16,36,61,.12);
    }

    .pic{
      height:225px;

      background:#f2eee7;

      display:flex;

      align-items:center;
      justify-content:center;

      overflow:hidden;

      position:relative;
    }

    .pic img{
      width:100%;
      height:100%;

      object-fit:cover;

      display:block;

      transition:transform .35s ease;
    }

    .card:hover .pic img{
      transform:scale(1.035);
    }

    .body{
      padding:17px;

      display:flex;
      flex-direction:column;

      flex:1;
    }

    .tag{
      display:inline-block;

      width:max-content;

      background:#eef8f3;

      color:var(--green);

      border-radius:999px;

      padding:4px 9px;

      font-size:11px;

      font-weight:900;
    }

    .body h3{
      margin:9px 0 6px;

      font-size:18px;

      line-height:1.5;

      color:var(--navy);
    }

    .body p{
      margin:0;

      color:var(--muted);

      font-size:13px;

      line-height:1.8;

      display:-webkit-box;

      -webkit-line-clamp:2;

      -webkit-box-orient:vertical;

      overflow:hidden;
    }

    /* =========================
       PRICES
    ========================= */

    .price-box{
      display:flex;

      align-items:center;

      gap:9px;

      flex-wrap:wrap;

      margin-top:13px;
    }

    .current-price{
      color:var(--navy);

      font-size:20px;

      font-weight:900;
    }

    .current-price small{
      font-size:11px;
      font-weight:800;
    }

    .old-price{
      color:#999;

      text-decoration:line-through;

      font-size:12px;

      font-weight:700;
    }

    /* =========================
       ACTIONS
    ========================= */

    .actions{
      display:flex;

      gap:8px;

      margin-top:auto;
      padding-top:14px;
    }

    .details,
    .whatsapp{
      flex:1;

      text-align:center;

      text-decoration:none;

      border-radius:11px;

      padding:10px;

      font-weight:900;

      border:0;

      cursor:pointer;

      font:inherit;

      transition:.2s ease;
    }

    .details{
      background:#f0ece5;
      color:var(--navy);
    }

    .details:hover{
      background:#e6ddcf;
    }

    .whatsapp{
      background:var(--green);
      color:#fff;
    }

    .whatsapp:hover{
      filter:brightness(1.08);
      transform:translateY(-1px);
    }

    /* =========================
       EMPTY
    ========================= */

    .empty{
      text-align:center;

      padding:50px 20px;

      background:#fff;

      border-radius:20px;

      border:1px dashed var(--border);

      color:var(--muted);

      margin-top:18px;
    }

    /* =========================
       MODAL
    ========================= */

    .modal{
      position:fixed;

      inset:0;

      background:rgba(5,15,25,.72);

      display:none;

      align-items:center;
      justify-content:center;

      padding:18px;

      z-index:100;
    }

    .modal.show{
      display:flex;
    }

    .modalbox{
      width:min(850px,100%);

      max-height:min(90vh,760px);

      overflow:auto;

      background:#fff;

      border-radius:24px;

      position:relative;

      display:grid;

      grid-template-columns:1fr 1fr;

      box-shadow:
        0 30px 90px rgba(0,0,0,.28);
    }

    .close{
      position:absolute;

      top:12px;
      left:12px;

      width:40px;
      height:40px;

      border:0;

      border-radius:50%;

      background:rgba(16,36,61,.08);

      color:var(--navy);

      font-size:26px;

      cursor:pointer;

      z-index:2;
    }

    .close:hover{
      background:rgba(16,36,61,.14);
    }

    .modalpic{
      min-height:430px;

      background:#f2eee7;
    }

    .modalpic img{
      width:100%;
      height:100%;

      min-height:430px;

      object-fit:cover;

      display:block;
    }

    .modalinfo{
      padding:38px;
    }

    .modalinfo h2{
      font-size:30px;

      line-height:1.4;

      margin:10px 0;

      color:var(--navy);
    }

    .modalinfo p{
      line-height:2;

      color:var(--muted);

      white-space:pre-wrap;
    }

    .modalinfo .price-box{
      margin-top:20px;
    }

    .modalinfo a{
      display:block;

      text-align:center;

      background:var(--green);

      color:#fff;

      text-decoration:none;

      border-radius:13px;

      padding:13px;

      font-weight:900;

      margin-top:20px;
    }

    .modalinfo a:hover{
      filter:brightness(1.08);
    }

    /* =========================
       FOOTER
    ========================= */

    footer{
      padding:25px 0;

      background:var(--navy);

      color:rgba(255,255,255,.7);

      text-align:center;
    }

    footer strong{
      color:var(--gold2);
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media(max-width:900px){

      .grid{
        grid-template-columns:
          repeat(3,1fr);
      }

    }

    @media(max-width:700px){

      .navlinks{
        display:none;
      }

      .brand img{
        width:130px;
      }

      .toolbar{
        flex-direction:column;
      }

      .grid{
        grid-template-columns:
          repeat(2,1fr);
      }

      .modalbox{
        grid-template-columns:1fr;
      }

      .modalpic{
        height:300px;
        min-height:0;
      }

      .modalpic img{
        min-height:0;
        height:300px;
      }

      .modalinfo{
        padding:25px;
      }

    }

    @media(max-width:460px){

      .container{
        width:min(100% - 22px,1180px);
      }

      .grid{
        grid-template-columns:1fr;
      }

      .hero{
        padding-top:42px;
      }

      .pic{
        height:240px;
      }

      .selected{
        align-items:flex-start;
        flex-direction:column;
      }

    }

  </style>
</head>


<body>

  <!-- ================= HEADER ================= -->

  <header class="header">

    <div class="container nav">

      <a
        class="brand"
        href="./"
        aria-label="أبو طارق للأدوات المنزلية"
      >
        <img
          src="./assets/logo.png"
          alt="شعار أبو طارق للأدوات المنزلية"
        >
      </a>


      <nav
        class="navlinks"
        aria-label="القائمة الرئيسية"
      >

        <a href="./">
          الرئيسية
        </a>

        <a href="#categories">
          الأقسام
        </a>

        <a href="#products">
          الأصناف
        </a>

      </nav>


      <a
        class="wa"
        href="https://wa.me/201551604163"
        target="_blank"
        rel="noopener"
      >
        واتساب
      </a>

    </div>

  </header>


  <!-- ================= HERO ================= -->

  <section class="hero">

    <div class="container">

      <div class="hero-overline">
        🛍️ الكتالوج الكامل
      </div>

      <h1>
        كل الأصناف في مكان واحد
      </h1>

      <p>
        اختار القسم، ابحث عن المنتج، وافتح تفاصيل الصنف
        أو تواصل معنا مباشرة على واتساب.
      </p>


      <div class="stats">

        <div class="stat">

          <b id="heroProductCount">
            0
          </b>

        </div>


        <div class="stat">

          <b id="heroCategoryCount">
            0
          </b>

          قسم

        </div>

      </div>

    </div>

  </section>


  <!-- ================= CATALOG ================= -->

  <main class="catalog container">


    <!-- SEARCH -->

    <div class="toolbar">

      <div class="search">

        <input
          id="searchInput"
          type="search"
          placeholder="ابحث باسم الصنف أو القسم..."
          autocomplete="off"
        >

        <button
          id="clearSearch"
          hidden
          type="button"
        >
          مسح
        </button>

      </div>

    </div>


    <!-- CATEGORIES -->

    <section id="categories">

      <div
        class="categories"
        id="categoriesGrid"
      ></div>

    </section>


    <!-- SELECTED CATEGORY -->

    <div
      class="selected"
      id="selectedCategory"
      hidden
    >

      <div>

        أنت تتصفح:

        <strong id="selectedCategoryName"></strong>

        <span id="selectedCategoryCount"></span>

      </div>


      <button
        id="clearCategory"
        type="button"
      >
        كل الأصناف
      </button>

    </div>


    <!-- PRODUCTS -->

    <section id="products">

      <div
        class="grid"
        id="productsGrid"
      ></div>


      <div
        class="empty"
        id="empty"
        hidden
      >
        لا توجد أصناف مطابقة للبحث.
      </div>

    </section>

  </main>


  <!-- ================= PRODUCT MODAL ================= -->

  <div
    class="modal"
    id="productModal"
    aria-hidden="true"
  >

    <div
      class="modalbox"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalName"
    >

      <button
        class="close"
        id="modalClose"
        aria-label="إغلاق"
        type="button"
      >
        ×
      </button>


      <div class="modalpic">

        <img
          id="modalImage"
          alt=""
        >

      </div>


      <div class="modalinfo">

        <span
          class="tag"
          id="modalCategory"
        ></span>


        <h2 id="modalName"></h2>


        <p id="modalDesc"></p>


        <div id="modalPrice"></div>


        <a
          id="modalWhatsapp"
          target="_blank"
          rel="noopener"
        >
          💬 اسأل عن الصنف على واتساب
        </a>

      </div>

    </div>

  </div>


  <!-- ================= FOOTER ================= -->

  <footer>

    © <span id="year"></span>

    <strong>
      أبو طارق للأدوات المنزلية
    </strong>

    — كل احتياجات البيت في مكان واحد

  </footer>


  <!-- ================= PAGE SCRIPT ================= -->

  <script>

  (() => {

    "use strict";


    const DATA_URL =
      "https://script.google.com/macros/s/AKfycbyw7k-K9akpV08vSjXbDmZ8khpHH9LOq2G9WLDHT2-iOJiTThN-kvEaCKI0-wKWu7hY/exec";


    const WHATSAPP_NUMBER =
      "201551604163";


    const CACHE_KEY =
      "abo_tarek_catalog_v3";


    const CACHE_TIME =
      30 * 60 * 1000;


    const $ = (id) =>
      document.getElementById(id);


    const clean = (value) =>
      String(value ?? "")
        .replace(/\s+/g, " ")
        .trim();


    const normalizeArabic = (value) => {

      return clean(value)
        .toLowerCase()
        .replace(/[أإآ]/g, "ا")
        .replace(/ة/g, "ه")
        .replace(/ى/g, "ي")
        .replace(/[\u064B-\u065F\u0670]/g, "");

    };


    const escapeHtml = (value) => {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    };


    let products = [];
    let sections = [];
    let selectedCategory = "";
    let searchTimer = null;


    /* =========================
       ACTIVE CHECK
    ========================= */

    function isActive(value) {

      if (
        value === false ||
        value === 0
      ) {
        return false;
      }

      const normalized =
        normalizeArabic(value);

      return ![
        "false",
        "0",
        "no",
        "inactive",
        "غير نشط"
      ].includes(normalized);

    }


    /* =========================
       IMAGE URL
    ========================= */

    function resolveImage(value) {

      const source = clean(value);

      if (!source) {
        return "";
      }

      if (
        /^https?:\/\//i.test(source) ||
        source.startsWith("data:")
      ) {
        return source;
      }

      return (
        "https://abotarek963258-cmyk.github.io/abo-tarek-store/" +
        source
          .replace(/^\.?\//, "")
          .split("/")
          .map(encodeURIComponent)
          .join("/")
      );

    }


    /* =========================
       WHATSAPP
    ========================= */

    function getWhatsAppLink(product) {

      const name =
        clean(product.name) || "الصنف";

      const message =
        "السلام عليكم،\n" +
        "أرغب في الاستفسار عن:\n" +
        "🛍️ " +
        name +
        "\n" +
        "هل الصنف متاح؟";

      return (
        "https://wa.me/" +
        WHATSAPP_NUMBER +
        "?text=" +
        encodeURIComponent(message)
      );

    }


    /* =========================
       NORMALIZE PRODUCT
    ========================= */

    function normalizeProduct(product, index) {

      const p = product || {};

      return {

        id:
          clean(
            p.id ||
            p.ID
          ) ||
          "p" + index,

        name:
          clean(
            p.name ||
            p.Name ||
            p.title
          ) ||
          "صنف بدون اسم",

        category:
          clean(
            p.category ||
            p.Category ||
            p.cat
          ) ||
          "أدوات منزلية",

        image:
          resolveImage(
            p.image ||
            p.Image ||
            p.imageUrl
          ),

        description:
          clean(
            p.description ||
            p.Description ||
            p.desc
          ),

        active:
          isActive(
            p.active ??
            true
          ),

        showHome:
          isActive(
            p.showHome ??
            true
          ),

        isOffer:
          isActive(
            p.isOffer ??
            false
          ),

        price:
          clean(
            p.price ||
            p.Price
          ),

        oldPrice:
          clean(
            p.oldPrice ||
            p.OldPrice
          ),

        offerPrice:
          clean(
            p.offerPrice ||
            p.OfferPrice
          )

      };

    }


    /* =========================
       CACHE
    ========================= */

    function saveCache() {

      try {

        localStorage.setItem(
          CACHE_KEY,
          JSON.stringify({
            time: Date.now(),
            products,
            sections
          })
        );

      } catch (error) {

        console.warn(
          "تعذر حفظ الكاش",
          error
        );

      }

    }


    function readCache() {

      try {

        const data =
          JSON.parse(
            localStorage.getItem(CACHE_KEY) ||
            "null"
          );

        if (
          data &&
          Array.isArray(data.products) &&
          Date.now() - data.time < CACHE_TIME
        ) {

          return data;

        }

      } catch (error) {

        console.warn(
          "تعذر قراءة الكاش",
          error
        );

      }

      return null;

    }


    /* =========================
       LOAD DATA
    ========================= */

    async function fetchData() {

      const response =
        await fetch(
          DATA_URL,
          {
            cache: "default"
          }
        );


      if (!response.ok) {

        throw new Error(
          "HTTP " +
          response.status
        );

      }


      const data =
        await response.json();


      const rawProducts =
        Array.isArray(data)
          ? data
          : (
              Array.isArray(data?.products)
                ? data.products
                : []
            );


      products =
        rawProducts
          .map(normalizeProduct)
          .filter(
            product =>
              product.active
          );


      const rawSections =
        Array.isArray(data?.sections)
          ? data.sections
          : [];


      sections =
        rawSections
          .filter(
            section =>
              isActive(section.active)
          )
          .sort(
            (a, b) =>
              (
                Number(a.sortOrder) || 9999
              ) -
              (
                Number(b.sortOrder) || 9999
              )
          );


      /*
       * لو الـ API لم يرجع Sections،
       * نبني الأقسام من المنتجات
       * كحل احتياطي.
       */

      if (!sections.length) {

        const seen =
          new Set();


        sections =
          products
            .filter(product => {

              const key =
                normalizeArabic(
                  product.category
                );

              if (seen.has(key)) {
                return false;
              }

              seen.add(key);

              return true;

            })
            .map(
              (product, index) => ({
                id:
                  "s" + index,

                name:
                  product.category,

                sortOrder:
                  index,

                active:
                  true
              })
            );

      }


      saveCache();

      render();

    }


    /* =========================
       CATEGORY COUNTS
    ========================= */

    function getCategoryCounts() {

      const counts = {};

      products.forEach(product => {

        const key =
          normalizeArabic(
            product.category
          );

        counts[key] =
          (
            counts[key] || 0
          ) + 1;

      });

      return counts;

    }


    /* =========================
       RENDER CATEGORIES
    ========================= */

    function renderCategories() {

      const grid =
        $("categoriesGrid");


      const counts =
        getCategoryCounts();


      if (!sections.length) {

        grid.innerHTML = "";

        return;

      }


      grid.innerHTML =
        sections
          .map(section => {

            const name =
              clean(section.name);


            if (!name) {
              return "";
            }


            const key =
              normalizeArabic(name);


            const count =
              counts[key] || 0;


            const activeClass =
              normalizeArabic(
                selectedCategory
              ) === key
                ? "active"
                : "";


            return `

              <button
                class="cat ${activeClass}"
                data-cat="${escapeHtml(name)}"
                type="button"
              >

                <span class="icon">
                  🛍️
                </span>

                <strong>
                  ${escapeHtml(name)}
                </strong>

                <small>
                  ${count} صنف
                </small>

              </button>

            `;

          })
          .join("");

    }


    /* =========================
       PRICE HTML
    ========================= */

    function getPriceHtml(product) {

      const current =
        clean(
          product.offerPrice ||
          product.price
        );


      const old =
        clean(
          product.oldPrice
        );


      if (!current) {
        return "";
      }


      return `

        <div class="price-box">

          ${
            old
              ? `
                <span class="old-price">
                  ${escapeHtml(old)} ج.م
                </span>
              `
              : ""
          }

          <span class="current-price">

            ${escapeHtml(current)}

            <small>
              ج.م
            </small>

          </span>

        </div>

      `;

    }


    /* =========================
       RENDER PRODUCTS
    ========================= */

    function renderProducts() {

      let list =
        products.slice();


      const query =
        normalizeArabic(
          $("searchInput").value
        );


      if (selectedCategory) {

        const selectedKey =
          normalizeArabic(
            selectedCategory
          );

        list =
          list.filter(
            product =>
              normalizeArabic(
                product.category
              ) === selectedKey
          );

      }


      if (query) {

        list =
          list.filter(product => {

            const text =
              [
                product.name,
                product.category,
                product.description
              ]
                .join(" ");


            return normalizeArabic(
              text
            ).includes(query);

          });

      }


      $("heroProductCount")
        .textContent =
          products.length;


      $("heroCategoryCount")
        .textContent =
          sections.length;


      renderCategories();


      const selectedBox =
        $("selectedCategory");


      if (selectedCategory) {

        selectedBox.hidden = false;


        $("selectedCategoryName")
          .textContent =
            selectedCategory;


        $("selectedCategoryCount")
          .textContent =
            " — " +
            list.length +
            " صنف";

      } else {

        selectedBox.hidden = true;

      }


      const grid =
        $("productsGrid");


      grid.innerHTML =
        list
          .map(
            (product, index) => {

              const image =
                product.image;


              const imageHtml =
                image
                  ? `

                    <img
                      src="${escapeHtml(image)}"
                      alt="${escapeHtml(product.name)}"
                      loading="${
                        index < 4
                          ? "eager"
                          : "lazy"
                      }"
                      onerror="
                        this.style.display='none';
                        this.parentElement
                          .querySelector('.fallback-icon')
                          .style.display='block';
                      "
                    >

                  `
                  : "";


              return `

                <article
                  class="card"
                >

                  <div class="pic">

                    ${imageHtml}

                    <span
                      class="fallback-icon"
                      style="
                        display:${image ? "none" : "block"};
                        font-size:55px;
                      "
                    >
                      🛍️
                    </span>

                  </div>


                  <div class="body">

                    <span class="tag">
                      ${escapeHtml(
                        product.category
                      )}
                    </span>


                    <h3>
                      ${escapeHtml(
                        product.name
                      )}
                    </h3>


                    <p>
                      ${escapeHtml(
                        product.description ||
                        "للاستفسار عن تفاصيل الصنف تواصل معنا."
                      )}
                    </p>


                    ${
                      getPriceHtml(product)
                    }


                    <div class="actions">

                      <button
                        class="details"
                        data-id="${escapeHtml(product.id)}"
                        type="button"
                      >
                        التفاصيل
                      </button>


                      <a
                        class="whatsapp"
                        href="${escapeHtml(
                          getWhatsAppLink(product)
                        )}"
                        target="_blank"
                        rel="noopener"
                      >
                        واتساب
                      </a>

                    </div>

                  </div>

                </article>

              `;

            }
          )
          .join("");


      $("empty").hidden =
        list.length > 0;

    }


    /* =========================
       OPEN PRODUCT
    ========================= */

    function openProduct(product) {

      if (!product) {
        return;
      }


      const image =
        $("modalImage");


      if (product.image) {

        image.src =
          product.image;

        image.style.display =
          "block";

      } else {

        image.removeAttribute("src");

        image.style.display =
          "none";

      }


      image.alt =
        product.name;


      $("modalCategory")
        .textContent =
          product.category;


      $("modalName")
        .textContent =
          product.name;


      $("modalDesc")
        .textContent =
          product.description ||
          "للاستفسار عن تفاصيل الصنف، تواصل معنا على واتساب.";


      $("modalPrice")
        .innerHTML =
          getPriceHtml(product);


      $("modalWhatsapp")
        .href =
          getWhatsAppLink(product);


      $("productModal")
        .classList
        .add("show");


      $("productModal")
        .setAttribute(
          "aria-hidden",
          "false"
        );


      document.body.style.overflow =
        "hidden";

    }


    /* =========================
       CLOSE PRODUCT
    ========================= */

    function closeProduct() {

      $("productModal")
        .classList
        .remove("show");


      $("productModal")
        .setAttribute(
          "aria-hidden",
          "true"
        );


      document.body.style.overflow =
        "";

    }


    /* =========================
       EVENTS
    ========================= */

    $("categoriesGrid")
      .addEventListener(
        "click",
        event => {

          const button =
            event.target.closest(
              "[data-cat]"
            );


          if (!button) {
            return;
          }


          selectedCategory =
            button.dataset.cat;


          renderProducts();


          history.replaceState(
            null,
            "",
            "#category"
          );

        }
      );


    $("clearCategory")
      .addEventListener(
        "click",
        () => {

          selectedCategory =
            "";

          renderProducts();

        }
      );


    $("searchInput")
      .addEventListener(
        "input",
        () => {

          clearTimeout(
            searchTimer
          );


          searchTimer =
            setTimeout(
              () => {

                renderProducts();

              },
              80
            );


          $("clearSearch")
            .hidden =
              !$("searchInput").value;

        }
      );


    $("clearSearch")
      .addEventListener(
        "click",
        () => {

          $("searchInput")
            .value =
              "";

          $("clearSearch")
            .hidden =
              true;

          renderProducts();

          $("searchInput").focus();

        }
      );


    $("productsGrid")
      .addEventListener(
        "click",
        event => {

          const button =
            event.target.closest(
              "[data-id]"
            );


          if (!button) {
            return;
          }


          const product =
            products.find(
              item =>
                String(item.id) ===
                String(button.dataset.id)
            );


          if (product) {

            openProduct(
              product
            );

          }

        }
      );


    $("modalClose")
      .addEventListener(
        "click",
        closeProduct
      );


    $("productModal")
      .addEventListener(
        "click",
        event => {

          if (
            event.target ===
            $("productModal")
          ) {

            closeProduct();

          }

        }
      );


    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape"
        ) {

          closeProduct();

        }

      }
    );


    /* =========================
       YEAR
    ========================= */

    $("year")
      .textContent =
        new Date()
          .getFullYear();


    /* =========================
       START
    ========================= */

    const cached =
      readCache();


    if (cached) {

      products =
        cached.products;

      sections =
        cached.sections;

      renderProducts();


      fetchData()
        .catch(
          error =>
            console.warn(
              "Background refresh failed:",
              error
            )
        );

    } else {

      fetchData()
        .catch(
          error => {

            console.error(
              "Catalog loading failed:",
              error
            );


            $("productsGrid")
              .innerHTML =
                "";


            $("empty")
              .hidden =
                false;

          }
        );

    }

  })();

  </script>

</body>

</html>
