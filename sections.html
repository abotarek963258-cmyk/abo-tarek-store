<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">

  <meta name="viewport"
        content="width=device-width,initial-scale=1,viewport-fit=cover">

  <meta name="theme-color" content="#071321">

  <title>كل الأصناف | أبو طارق للأدوات المنزلية في الإسكندرية</title>

  <meta name="description"
        content="تصفح كل أصناف أبو طارق للأدوات المنزلية في الإسكندرية. أدوات المطبخ والسفرة والأكواب والكاسات والشاي والقهوة والمزيد.">

  <meta name="robots" content="index,follow">

  <link rel="canonical"
        href="https://abotarek963258-cmyk.github.io/abo-tarek-store/sections.html">

  <!-- Favicon -->
  <link rel="icon"
        type="image/png"
        href="./assets/logo.png">

  <link rel="apple-touch-icon"
        href="./assets/logo.png">

  <!-- Performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="dns-prefetch" href="//script.google.com">
  <link rel="dns-prefetch" href="//github.com">

  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap">

  <!-- Main design -->
  <link rel="stylesheet"
        href="./style.css?v=6000">

  <!-- Features: cart / wishlist / product UI -->
  <link rel="stylesheet"
        href="./features.css?v=6000">

  <style>
    /* =========================================================
       ABO TAREK — SECTIONS / CATALOG
       DARK NAVY LUXURY
       ========================================================= */

    :root {
      --catalog-navy: #071321;
      --catalog-navy-2: #0b1c2d;
      --catalog-navy-3: #10263b;
      --catalog-cream: #f7f1e4;
      --catalog-cream-2: #eee5d4;
      --catalog-gold: #d4af37;
      --catalog-gold-soft: rgba(212,175,55,.16);
      --catalog-text: #f8f2e7;
      --catalog-muted: #aeb9c4;
      --catalog-border: rgba(212,175,55,.18);
      --catalog-shadow: 0 16px 40px rgba(0,0,0,.22);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      background: var(--catalog-navy);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 85% 0%,
          rgba(212,175,55,.07),
          transparent 28%
        ),
        var(--catalog-navy);
      color: var(--catalog-text);
      font-family: "Cairo", system-ui, sans-serif;
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    img {
      max-width: 100%;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================================================
       TOP STRIP
       ========================================================= */

    .catalog-top-strip {
      min-height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 14px;

      background:
        linear-gradient(
          90deg,
          #071321,
          #10263b,
          #071321
        );

      border-bottom: 1px solid rgba(212,175,55,.12);

      color: var(--catalog-cream);
      font-size: 12px;
      font-weight: 600;
      text-align: center;
    }

    /* =========================================================
       HEADER
       ========================================================= */

    .catalog-header {
      position: sticky;
      top: 0;
      z-index: 100;

      background: rgba(7,19,33,.94);
      border-bottom: 1px solid rgba(212,175,55,.14);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .catalog-header-inner {
      width: min(1280px, calc(100% - 28px));
      min-height: 74px;
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .catalog-brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .catalog-logo {
      width: 48px;
      height: 48px;
      flex: 0 0 48px;

      object-fit: contain;

      border-radius: 13px;

      background: var(--catalog-cream);

      padding: 5px;

      box-shadow:
        0 8px 24px rgba(0,0,0,.22),
        0 0 0 1px rgba(212,175,55,.18);
    }

    .catalog-brand-text {
      min-width: 0;
    }

    .catalog-brand-title {
      margin: 0;

      color: var(--catalog-cream);

      font-size: 17px;
      font-weight: 800;
      line-height: 1.2;

      white-space: nowrap;
    }

    .catalog-brand-subtitle {
      margin-top: 3px;

      color: var(--catalog-gold);

      font-size: 11px;
      font-weight: 600;
    }

    .catalog-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .catalog-header-btn {
      min-width: 42px;
      height: 42px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border: 1px solid rgba(212,175,55,.18);
      border-radius: 12px;

      background: rgba(255,255,255,.035);

      color: var(--catalog-cream);

      cursor: pointer;

      transition:
        transform .18s ease,
        background .18s ease,
        border-color .18s ease;
    }

    .catalog-header-btn:hover {
      transform: translateY(-1px);
      background: rgba(212,175,55,.09);
      border-color: rgba(212,175,55,.35);
    }

    .catalog-home-btn {
      padding: 0 13px;
      gap: 6px;

      font-size: 12px;
      font-weight: 700;
    }

    /* =========================================================
       PAGE
       ========================================================= */

    .catalog-page {
      width: min(1280px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 60px;
    }

    .catalog-heading {
      margin-bottom: 22px;
    }

    .catalog-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      margin-bottom: 8px;

      color: var(--catalog-gold);

      font-size: 12px;
      font-weight: 800;
    }

    .catalog-eyebrow::before {
      content: "";
      width: 24px;
      height: 1px;
      background: var(--catalog-gold);
    }

    .catalog-heading h1 {
      margin: 0;

      color: var(--catalog-cream);

      font-size: clamp(26px, 4vw, 38px);
      line-height: 1.2;
      font-weight: 800;
    }

    .catalog-heading p {
      max-width: 720px;
      margin: 9px 0 0;

      color: var(--catalog-muted);

      font-size: 13px;
      line-height: 1.9;
    }

    /* =========================================================
       SEARCH
       ========================================================= */

    .catalog-search-wrap {
      position: relative;
      margin-bottom: 17px;
    }

    .catalog-search {
      width: 100%;
      height: 52px;

      padding: 0 48px 0 16px;

      border: 1px solid var(--catalog-border);
      border-radius: 15px;

      outline: none;

      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,.055),
          rgba(255,255,255,.025)
        );

      color: var(--catalog-cream);

      font-size: 14px;

      transition:
        border-color .2s ease,
        box-shadow .2s ease,
        background .2s ease;
    }

    .catalog-search::placeholder {
      color: #84919d;
    }

    .catalog-search:focus {
      border-color: rgba(212,175,55,.55);

      box-shadow:
        0 0 0 3px rgba(212,175,55,.08);

      background: rgba(255,255,255,.055);
    }

    .catalog-search-icon {
      position: absolute;

      right: 17px;
      top: 50%;

      transform: translateY(-50%);

      color: var(--catalog-gold);

      font-size: 18px;

      pointer-events: none;
    }

    /* =========================================================
       SECTIONS FILTER
       ========================================================= */

    .catalog-sections-bar {
      display: flex;
      gap: 8px;

      margin-bottom: 24px;

      overflow-x: auto;

      padding-bottom: 4px;

      scrollbar-width: thin;
      scrollbar-color: rgba(212,175,55,.45) transparent;
    }

    .catalog-sections-bar::-webkit-scrollbar {
      height: 4px;
    }

    .catalog-sections-bar::-webkit-scrollbar-thumb {
      background: rgba(212,175,55,.4);
      border-radius: 999px;
    }

    .catalog-filter {
      flex: 0 0 auto;

      min-height: 39px;

      padding: 7px 14px;

      border: 1px solid rgba(212,175,55,.17);
      border-radius: 999px;

      background: rgba(255,255,255,.035);

      color: #c8d0d7;

      cursor: pointer;

      font-size: 12px;
      font-weight: 700;

      transition:
        color .18s ease,
        background .18s ease,
        border-color .18s ease,
        transform .18s ease;
    }

    .catalog-filter:hover {
      transform: translateY(-1px);
      color: var(--catalog-cream);
      border-color: rgba(212,175,55,.4);
    }

    .catalog-filter.active {
      background: var(--catalog-gold);
      border-color: var(--catalog-gold);
      color: #071321;
      box-shadow: 0 7px 18px rgba(212,175,55,.16);
    }

    /* =========================================================
       RESULTS META
       ========================================================= */

    .catalog-results-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

      margin-bottom: 13px;
    }

    .catalog-results-title {
      color: var(--catalog-cream);

      font-size: 14px;
      font-weight: 800;
    }

    .catalog-results-count {
      color: var(--catalog-gold);

      font-size: 12px;
      font-weight: 700;
    }

    /* =========================================================
       PRODUCTS GRID
       ========================================================= */

    .catalog-products {
      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 15px;
    }

    /* =========================================================
       PRODUCT CARD
       ========================================================= */

    .catalog-product-card {
      position: relative;

      min-width: 0;

      display: flex;
      flex-direction: column;

      overflow: hidden;

      border: 1px solid rgba(212,175,55,.13);
      border-radius: 17px;

      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,.052),
          rgba(255,255,255,.022)
        );

      box-shadow: 0 10px 28px rgba(0,0,0,.15);

      transition:
        transform .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;
    }

    .catalog-product-card:hover {
      transform: translateY(-3px);

      border-color: rgba(212,175,55,.34);

      box-shadow:
        0 17px 35px rgba(0,0,0,.24);
    }

    /* =========================================================
       IMAGE
       ========================================================= */

    .catalog-product-image {
      position: relative;

      width: 100%;
      height: 172px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      background: var(--catalog-cream);

      border-bottom: 1px solid rgba(7,19,33,.07);
    }

    .catalog-product-image img {
      display: block;

      width: 100%;
      height: 100%;

      max-width: 100%;
      max-height: 100%;

      padding: 13px;

      object-fit: contain;
      object-position: center;

      background: var(--catalog-cream);

      transition:
        transform .25s ease;
    }

    .catalog-product-card:hover
    .catalog-product-image img {
      transform: scale(1.025);
    }

    .catalog-offer-badge {
      position: absolute;

      top: 9px;
      right: 9px;

      z-index: 2;

      min-height: 25px;

      display: inline-flex;
      align-items: center;

      padding: 4px 8px;

      border-radius: 999px;

      background: var(--catalog-gold);

      color: #071321;

      font-size: 10px;
      font-weight: 900;

      box-shadow: 0 6px 14px rgba(0,0,0,.15);
    }

    .catalog-wishlist-btn {
      position: absolute;

      top: 8px;
      left: 8px;

      z-index: 3;

      width: 34px;
      height: 34px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid rgba(7,19,33,.1);
      border-radius: 50%;

      background: rgba(247,241,228,.9);

      color: #071321;

      cursor: pointer;

      font-size: 16px;

      box-shadow: 0 5px 15px rgba(0,0,0,.13);

      transition:
        transform .18s ease,
        background .18s ease;
    }

    .catalog-wishlist-btn:hover {
      transform: scale(1.06);
    }

    /* =========================================================
       PRODUCT INFO
       ========================================================= */

    .catalog-product-body {
      display: flex;
      flex-direction: column;

      flex: 1;

      padding: 12px 12px 11px;
    }

    .catalog-product-category {
      margin-bottom: 4px;

      color: var(--catalog-gold);

      font-size: 10px;
      font-weight: 700;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .catalog-product-name {
      margin: 0;

      color: var(--catalog-cream);

      font-size: 14px;
      line-height: 1.55;
      font-weight: 800;

      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;

      overflow: hidden;

      min-height: 43px;
    }

    .catalog-product-description {
      margin: 5px 0 0;

      color: #9ca8b3;

      font-size: 10px;
      line-height: 1.65;

      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;

      overflow: hidden;

      min-height: 33px;
    }

    /* =========================================================
       PRICE
       ========================================================= */

    .catalog-price-box {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;

      margin-top: 9px;

      min-height: 26px;
    }

    .catalog-price {
      color: var(--catalog-gold);

      font-size: 15px;
      font-weight: 900;
    }

    .catalog-old-price {
      color: #7e8993;

      font-size: 10px;

      text-decoration: line-through;
    }

    .catalog-no-price {
      color: #8d99a4;

      font-size: 10px;
      font-weight: 600;
    }

    /* =========================================================
       CARD ACTIONS
       ========================================================= */

    .catalog-card-actions {
      display: grid;

      grid-template-columns: 1fr 40px;

      gap: 7px;

      margin-top: 10px;
    }

    .catalog-add-btn,
    .catalog-details-btn {
      min-height: 38px;

      border-radius: 11px;

      cursor: pointer;

      font-size: 11px;
      font-weight: 800;

      transition:
        transform .18s ease,
        background .18s ease,
        border-color .18s ease;
    }

    .catalog-add-btn {
      border: 1px solid var(--catalog-gold);

      background: var(--catalog-gold);

      color: #071321;
    }

    .catalog-add-btn:hover {
      transform: translateY(-1px);

      background: #e1c252;
    }

    .catalog-details-btn {
      border: 1px solid rgba(212,175,55,.18);

      background: rgba(255,255,255,.035);

      color: var(--catalog-cream);
    }

    .catalog-details-btn:hover {
      transform: translateY(-1px);

      background: rgba(212,175,55,.08);

      border-color: rgba(212,175,55,.4);
    }

    /* =========================================================
       EMPTY / LOADING
       ========================================================= */

    .catalog-state {
      grid-column: 1 / -1;

      min-height: 230px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 30px;

      border: 1px dashed rgba(212,175,55,.18);
      border-radius: 18px;

      color: var(--catalog-muted);

      text-align: center;
    }

    .catalog-state-icon {
      margin-bottom: 8px;

      color: var(--catalog-gold);

      font-size: 30px;
    }

    .catalog-state-title {
      color: var(--catalog-cream);

      font-size: 15px;
      font-weight: 800;
    }

    .catalog-state-text {
      margin-top: 5px;

      font-size: 11px;
    }

    /* =========================================================
       SKELETON
       ========================================================= */

    .catalog-skeleton {
      overflow: hidden;

      border-radius: 17px;

      background: rgba(255,255,255,.035);

      border: 1px solid rgba(212,175,55,.09);
    }

    .catalog-skeleton-image {
      height: 172px;

      background:
        linear-gradient(
          90deg,
          rgba(255,255,255,.035),
          rgba(255,255,255,.09),
          rgba(255,255,255,.035)
        );

      background-size: 200% 100%;

      animation: catalogSkeleton 1.35s infinite;
    }

    .catalog-skeleton-body {
      padding: 13px;
    }

    .catalog-skeleton-line {
      height: 10px;

      margin-bottom: 9px;

      border-radius: 999px;

      background:
        linear-gradient(
          90deg,
          rgba(255,255,255,.035),
          rgba(255,255,255,.09),
          rgba(255,255,255,.035)
        );

      background-size: 200% 100%;

      animation: catalogSkeleton 1.35s infinite;
    }

    .catalog-skeleton-line.short {
      width: 55%;
    }

    .catalog-skeleton-line.medium {
      width: 78%;
    }

    @keyframes catalogSkeleton {
      0% {
        background-position: 200% 0;
      }

      100% {
        background-position: -200% 0;
      }
    }

    /* =========================================================
       FOOTER
       ========================================================= */

    .catalog-footer {
      margin-top: 48px;

      padding-top: 22px;

      border-top: 1px solid rgba(212,175,55,.12);

      text-align: center;

      color: #87939e;

      font-size: 11px;
      line-height: 1.8;
    }

    .catalog-footer strong {
      color: var(--catalog-gold);
    }

    /* =========================================================
       RESPONSIVE
       ========================================================= */

    @media (max-width: 1100px) {
      .catalog-products {
        grid-template-columns:
          repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 760px) {
      .catalog-page {
        width: min(100% - 18px, 680px);
        padding-top: 20px;
      }

      .catalog-header-inner {
        width: calc(100% - 18px);
        min-height: 65px;
      }

      .catalog-logo {
        width: 42px;
        height: 42px;
        flex-basis: 42px;
      }

      .catalog-brand-title {
        font-size: 14px;
      }

      .catalog-brand-subtitle {
        font-size: 9px;
      }

      .catalog-home-btn {
        padding: 0 10px;
      }

      .catalog-home-btn span {
        display: none;
      }

      .catalog-products {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));

        gap: 11px;
      }

      .catalog-product-image {
        height: 155px;
      }

      .catalog-product-image img {
        padding: 11px;
      }

      .catalog-product-body {
        padding: 10px;
      }

      .catalog-product-name {
        font-size: 12px;
        min-height: 37px;
      }

      .catalog-product-description {
        font-size: 9px;
        min-height: 29px;
      }

      .catalog-price {
        font-size: 13px;
      }

      .catalog-card-actions {
        grid-template-columns: 1fr 36px;
      }

      .catalog-add-btn,
      .catalog-details-btn {
        min-height: 36px;
        font-size: 10px;
      }

      .catalog-skeleton-image {
        height: 155px;
      }
    }

    @media (max-width: 420px) {
      .catalog-products {
        gap: 9px;
      }

      .catalog-product-image {
        height: 142px;
      }

      .catalog-product-image img {
        padding: 9px;
      }

      .catalog-product-body {
        padding: 9px;
      }

      .catalog-product-name {
        font-size: 11px;
      }

      .catalog-product-description {
        display: none;
      }

      .catalog-card-actions {
        margin-top: 8px;
      }
    }

    /* =========================================================
       REDUCED MOTION
       ========================================================= */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- =======================================================
       TOP STRIP
       ======================================================= -->

  <div class="catalog-top-strip">
    ✦ أبو طارق للأدوات المنزلية — كل اللي بيتك محتاجه في مكان واحد
  </div>

  <!-- =======================================================
       HEADER
       ======================================================= -->

  <header class="catalog-header">

    <div class="catalog-header-inner">

      <a class="catalog-brand"
         href="./index.html"
         aria-label="العودة إلى الصفحة الرئيسية">

        <img
          class="catalog-logo"
          src="./assets/logo.png"
          width="48"
          height="48"
          alt="أبو طارق للأدوات المنزلية"
          loading="eager"
          decoding="async">

        <div class="catalog-brand-text">

          <div class="catalog-brand-title">
            أبو طارق للأدوات المنزلية
          </div>

          <div class="catalog-brand-subtitle">
            الإسكندرية
          </div>

        </div>

      </a>

      <div class="catalog-header-actions">

        <a
          class="catalog-header-btn catalog-home-btn"
          href="./index.html"
          aria-label="الرئيسية">

          <span>الرئيسية</span>
          <b>⌂</b>

        </a>

        <button
          class="catalog-header-btn"
          type="button"
          id="catalogCartButton"
          aria-label="السلة">

          🛒

        </button>

      </div>

    </div>

  </header>

  <!-- =======================================================
       MAIN
       ======================================================= -->

  <main class="catalog-page">

    <section class="catalog-heading">

      <div class="catalog-eyebrow">
        كتالوج أبو طارق
      </div>

      <h1>
        كل الأصناف
      </h1>

      <p>
        تصفح منتجات أبو طارق واختار اللي يناسب بيتك بسهولة.
      </p>

    </section>

    <!-- SEARCH -->

    <section class="catalog-search-wrap">

      <span class="catalog-search-icon">
        🔎
      </span>

      <input
        id="catalogSearch"
        class="catalog-search"
        type="search"
        inputmode="search"
        autocomplete="off"
        placeholder="ابحث عن منتج أو قسم..."
        aria-label="البحث عن منتج">

    </section>

    <!-- SECTIONS -->

    <nav
      id="catalogSections"
      class="catalog-sections-bar"
      aria-label="أقسام المنتجات">

      <button
        class="catalog-filter active"
        type="button"
        data-category="">

        كل الأصناف

      </button>

    </nav>

    <!-- META -->

    <div class="catalog-results-meta">

      <div
        id="catalogResultsTitle"
        class="catalog-results-title">

        كل المنتجات

      </div>

      <div
        id="catalogResultsCount"
        class="catalog-results-count">

        ...

      </div>

    </div>

    <!-- PRODUCTS -->

    <section
      id="catalogProducts"
      class="catalog-products"
      aria-live="polite">

      <div class="catalog-skeleton">
        <div class="catalog-skeleton-image"></div>
        <div class="catalog-skeleton-body">
          <div class="catalog-skeleton-line short"></div>
          <div class="catalog-skeleton-line"></div>
          <div class="catalog-skeleton-line medium"></div>
        </div>
      </div>

      <div class="catalog-skeleton">
        <div class="catalog-skeleton-image"></div>
        <div class="catalog-skeleton-body">
          <div class="catalog-skeleton-line short"></div>
          <div class="catalog-skeleton-line"></div>
          <div class="catalog-skeleton-line medium"></div>
        </div>
      </div>

      <div class="catalog-skeleton">
        <div class="catalog-skeleton-image"></div>
        <div class="catalog-skeleton-body">
          <div class="catalog-skeleton-line short"></div>
          <div class="catalog-skeleton-line"></div>
          <div class="catalog-skeleton-line medium"></div>
        </div>
      </div>

      <div class="catalog-skeleton">
        <div class="catalog-skeleton-image"></div>
        <div class="catalog-skeleton-body">
          <div class="catalog-skeleton-line short"></div>
          <div class="catalog-skeleton-line"></div>
          <div class="catalog-skeleton-line medium"></div>
        </div>
      </div>

    </section>

    <footer class="catalog-footer">
      <strong>أبو طارق للأدوات المنزلية</strong>
      — جودة واختيار يناسب كل بيت في الإسكندرية.
    </footer>

  </main>

  <!-- =======================================================
       FEATURES
       IMPORTANT:
       app.js IS INTENTIONALLY NOT LOADED HERE.
       ======================================================= -->

  <script src="./config.js?v=6000"></script>
  <script src="./features.js?v=6000" defer></script>

  <script>
    /* =========================================================
       ABO TAREK CATALOG ENGINE
       No app.js here.
       One public Apps Script request + local/session cache.
       ========================================================= */

    (() => {
      "use strict";

      const DATA_URL =
        "https://script.google.com/macros/s/AKfycbycQxcL3WeELjc-YQ6EY86X-QZXUtWKLH2WHz_CDoRY72SIhd5mBRQBUVhVuA-AfgME/exec";

      const CACHE_KEY = "abo_tarek_catalog_v10";
      const CACHE_TTL = 30 * 60 * 1000;

      const state = {
        products: [],
        sections: [],
        settings: {},
        query: "",
        category: "",
        ready: false
      };

      const $ = (selector) =>
        document.querySelector(selector);

      const searchInput =
        $("#catalogSearch");

      const sectionsBox =
        $("#catalogSections");

      const productsBox =
        $("#catalogProducts");

      const resultsCount =
        $("#catalogResultsCount");

      const resultsTitle =
        $("#catalogResultsTitle");

      /* =======================================================
         SAFE TEXT
         ======================================================= */

      function escapeHTML(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      /* =======================================================
         NORMALIZATION
         ======================================================= */

      function toBool(value) {
        if (
          value === true ||
          value === 1 ||
          value === "1"
        ) {
          return true;
        }

        const text =
          String(value ?? "")
            .trim()
            .toLowerCase();

        return [
          "true",
          "yes",
          "on",
          "نعم",
          "فعال",
          "نشط"
        ].includes(text);
      }

      function toNumber(value) {
        if (
          value === null ||
          value === undefined ||
          value === ""
        ) {
          return null;
        }

        const normalized =
          String(value)
            .replace(/,/g, "")
            .replace(/[^\d.-]/g, "");

        if (!normalized) {
          return null;
        }

        const number =
          Number(normalized);

        return Number.isFinite(number)
          ? number
          : null;
      }

      function normalizeProduct(raw) {
        if (!raw) return null;

        const product = {
          id: String(raw.id ?? ""),
          name: String(raw.name ?? "منتج"),
          category: String(raw.category ?? ""),
          image: String(raw.image ?? ""),
          description: String(raw.description ?? ""),
          active: toBool(raw.active),
          showHome: toBool(raw.showHome),
          isOffer: toBool(raw.isOffer),
          sortOrder:
            toNumber(raw.sortOrder) ?? 999999,

          price:
            toNumber(raw.price),

          oldPrice:
            toNumber(raw.oldPrice),

          offerPrice:
            toNumber(raw.offerPrice),

          images: []
        };

        let images = [];

        if (Array.isArray(raw.images)) {
          images = raw.images;
        } else if (typeof raw.images === "string") {
          try {
            const parsed =
              JSON.parse(raw.images);

            if (Array.isArray(parsed)) {
              images = parsed;
            }
          } catch (_) {
            images =
              raw.images
                .split(/\r?\n|,/)
                .map(x => x.trim())
                .filter(Boolean);
          }
        }

        if (product.image) {
          images.unshift(product.image);
        }

        product.images =
          [...new Set(
            images
              .map(x => String(x || "").trim())
              .filter(Boolean)
          )].slice(0, 5);

        if (!product.image && product.images[0]) {
          product.image =
            product.images[0];
        }

        return product;
      }

      function normalizeSection(raw) {
        if (!raw) return null;

        return {
          id: String(raw.id ?? ""),
          name: String(raw.name ?? ""),
          sortOrder:
            toNumber(raw.sortOrder) ?? 999999,
          active: toBool(raw.active)
        };
      }

      /* =======================================================
         CACHE
         ======================================================= */

      function saveCache(data) {
        try {
          localStorage.setItem(
            CACHE_KEY,
            JSON.stringify({
              time: Date.now(),
              data
            })
          );
        } catch (_) {}
      }

      function readCache() {
        try {
          const raw =
            localStorage.getItem(CACHE_KEY);

          if (!raw) {
            return null;
          }

          const cached =
            JSON.parse(raw);

          if (
            !cached ||
            !cached.time ||
            !cached.data
          ) {
            return null;
          }

          return cached;
        } catch (_) {
          return null;
        }
      }

      /* =======================================================
         APPLY DATA
         ======================================================= */

      function applyData(payload) {
        const rawProducts =
          Array.isArray(payload?.products)
            ? payload.products
            : [];

        const rawSections =
          Array.isArray(payload?.sections)
            ? payload.sections
            : [];

        state.products =
          rawProducts
            .map(normalizeProduct)
            .filter(Boolean)
            .filter(product => product.active)
            .sort(
              (a, b) =>
                a.sortOrder - b.sortOrder
            );

        state.sections =
          rawSections
            .map(normalizeSection)
            .filter(Boolean)
            .filter(section => section.active)
            .sort(
              (a, b) =>
                a.sortOrder - b.sortOrder
            );

        state.settings =
          payload?.settings &&
          typeof payload.settings === "object"
            ? payload.settings
            : {};

        state.ready = true;

        renderSections();
        renderProducts();
      }

      /* =======================================================
         FETCH
         ======================================================= */

      async function fetchCatalog() {
        try {
          const response =
            await fetch(DATA_URL, {
              method: "GET",
              cache: "no-store"
            });

          if (!response.ok) {
            throw new Error(
              "HTTP " + response.status
            );
          }

          const payload =
            await response.json();

          if (
            !payload ||
            payload.ok === false
          ) {
            throw new Error(
              payload?.error ||
              "catalog_request_failed"
            );
          }

          saveCache(payload);

          applyData(payload);

          return true;

        } catch (error) {

          console.warn(
            "Catalog request failed:",
            error
          );

          return false;
        }
      }

      /* =======================================================
         FILTER
         ======================================================= */

      function getFilteredProducts() {
        const query =
          state.query
            .trim()
            .toLocaleLowerCase("ar");

        const category =
          state.category
            .trim()
            .toLocaleLowerCase("ar");

        return state.products.filter(
          product => {

            const matchesCategory =
              !category ||
              String(product.category)
                .trim()
                .toLocaleLowerCase("ar") ===
                category;

            if (!matchesCategory) {
              return false;
            }

            if (!query) {
              return true;
            }

            const searchable =
              [
                product.name,
                product.category,
                product.description
              ]
                .join(" ")
                .toLocaleLowerCase("ar");

            return searchable.includes(query);
          }
        );
      }

      /* =======================================================
         SECTIONS
         ======================================================= */

      function renderSections() {
        const fragment =
          document.createDocumentFragment();

        const allButton =
          document.createElement("button");

        allButton.type = "button";
        allButton.className =
          "catalog-filter" +
          (!state.category ? " active" : "");

        allButton.dataset.category = "";
        allButton.textContent = "كل الأصناف";

        fragment.appendChild(allButton);

        state.sections.forEach(section => {

          if (!section.name) {
            return;
          }

          const button =
            document.createElement("button");

          button.type = "button";

          button.className =
            "catalog-filter" +
            (
              state.category === section.name
                ? " active"
                : ""
            );

          button.dataset.category =
            section.name;

          button.textContent =
            section.name;

          fragment.appendChild(button);
        });

        sectionsBox.replaceChildren(fragment);
      }

      /* =======================================================
         PRICE
         ======================================================= */

      function getDisplayPrice(product) {
        const offer =
          product.offerPrice;

        const regular =
          product.price;

        const old =
          product.oldPrice;

        if (
          product.isOffer &&
          offer !== null
        ) {
          return `
            <span class="catalog-price">
              ${formatPrice(offer)}
            </span>
            ${
              old !== null
                ? `
                  <span class="catalog-old-price">
                    ${formatPrice(old)}
                  </span>
                `
                : ""
            }
          `;
        }

        if (regular !== null) {
          return `
            <span class="catalog-price">
              ${formatPrice(regular)}
            </span>
          `;
        }

        if (offer !== null) {
          return `
            <span class="catalog-price">
              ${formatPrice(offer)}
            </span>
          `;
        }

        return `
          <span class="catalog-no-price">
            السعر عند الطلب
          </span>
        `;
      }

      function formatPrice(value) {
        const number =
          Number(value);

        if (!Number.isFinite(number)) {
          return "";
        }

        try {
          return new Intl.NumberFormat(
            "ar-EG"
          ).format(number) + " ج.م";
        } catch (_) {
          return number + " ج.م";
        }
      }

      /* =======================================================
         PRODUCT CARD
         ======================================================= */

      function productCard(product) {
        const image =
          product.image ||
          "./assets/logo.png";

        const name =
          escapeHTML(product.name);

        const category =
          escapeHTML(product.category);

        const description =
          escapeHTML(
            product.description
          );

        const id =
          escapeHTML(product.id);

        return `
          <article
            class="catalog-product-card"
            data-product-id="${id}">

            <div class="catalog-product-image">

              ${
                product.isOffer
                  ? `
                    <span class="catalog-offer-badge">
                      عرض
                    </span>
                  `
                  : ""
              }

              <button
                type="button"
                class="catalog-wishlist-btn"
                data-wishlist-id="${id}"
                aria-label="إضافة للمفضلة">

                ♡

              </button>

              <img
                src="${escapeHTML(image)}"
                alt="${name}"
                loading="lazy"
                decoding="async"
                width="360"
                height="172"
                onerror="this.onerror=null;this.src='./assets/logo.png';">

            </div>

            <div class="catalog-product-body">

              <div class="catalog-product-category">
                ${category || "أبو طارق"}
              </div>

              <h2 class="catalog-product-name">
                ${name}
              </h2>

              ${
                description
                  ? `
                    <p class="catalog-product-description">
                      ${description}
                    </p>
                  `
                  : ""
              }

              <div class="catalog-price-box">
                ${getDisplayPrice(product)}
              </div>

              <div class="catalog-card-actions">

                <button
                  type="button"
                  class="catalog-add-btn"
                  data-add-product="${id}">

                  🛒 إضافة للسلة

                </button>

                <button
                  type="button"
                  class="catalog-details-btn"
                  data-details-product="${id}"
                  aria-label="تفاصيل المنتج">

                  👁

                </button>

              </div>

            </div>

          </article>
        `;
      }

      /* =======================================================
         RENDER PRODUCTS
         ======================================================= */

      function renderProducts() {
        const products =
          getFilteredProducts();

        resultsCount.textContent =
          `${products.length} منتج`;

        if (state.query) {
          resultsTitle.textContent =
            `نتائج البحث عن: ${state.query}`;
        } else if (state.category) {
          resultsTitle.textContent =
            state.category;
        } else {
          resultsTitle.textContent =
            "كل المنتجات";
        }

        if (!products.length) {
          productsBox.innerHTML = `
            <div class="catalog-state">

              <div class="catalog-state-icon">
                🔎
              </div>

              <div class="catalog-state-title">
                مفيش منتجات مطابقة
              </div>

              <div class="catalog-state-text">
                جرّب كلمة بحث مختلفة أو اختار قسم تاني.
              </div>

            </div>
          `;

          return;
        }

        const fragment =
          document.createDocumentFragment();

        const wrapper =
          document.createElement("div");

        wrapper.style.display = "contents";

        wrapper.innerHTML =
          products
            .map(productCard)
            .join("");

        while (wrapper.firstElementChild) {
          fragment.appendChild(
            wrapper.firstElementChild
          );
        }

        productsBox.replaceChildren(
          fragment
        );
      }

      /* =======================================================
         FEATURES BRIDGE
         ======================================================= */

      function getFeatures() {
        return window.ABO_TAREK_FEATURES || null;
      }

      function addToCart(product) {
        const features =
          getFeatures();

        /*
         * IMPORTANT:
         * features.js owns the cart.
         * We do not maintain a second cart here.
         */

        if (
          features &&
          typeof features.addToCart === "function"
        ) {
          features.addToCart(product);
          return;
        }

        /*
         * Compatibility fallback only if
         * features.js has not finished loading yet.
         */

        document.dispatchEvent(
          new CustomEvent(
            "abo:tarek:add-to-cart",
            {
              detail: {
                product
              }
            }
          )
        );
      }

      function toggleWishlist(product) {
        const features =
          getFeatures();

        if (
          features &&
          typeof features.toggleWishlist === "function"
        ) {
          features.toggleWishlist(product);
          return;
        }

        if (
          features &&
          typeof features.addToWishlist === "function"
        ) {
          features.addToWishlist(product);
        }
      }

      function openProductDetails(product) {
        const features =
          getFeatures();

        if (
          features &&
          typeof features.openProduct === "function"
        ) {
          features.openProduct(product);
          return;
        }

        if (
          features &&
          typeof features.openProductModal === "function"
        ) {
          features.openProductModal(product);
          return;
        }

        window.location.href =
          "./product.html?id=" +
          encodeURIComponent(product.id);
      }

      /* =======================================================
         EVENT DELEGATION
         ONE LISTENER ONLY.
         NO DUPLICATE CART EVENTS.
         ======================================================= */

      productsBox.addEventListener(
        "click",
        event => {

          const addButton =
            event.target.closest(
              "[data-add-product]"
            );

          if (addButton) {

            const id =
              addButton.dataset.addProduct;

            const product =
              state.products.find(
                item => item.id === id
              );

            if (product) {
              addToCart(product);
            }

            return;
          }

      
          const wishlistButton =
            event.target.closest(
              "[data-wishlist-id]"
            );

          if (wishlistButton) {
            // features.js هو المسؤول عن تنفيذ ضغطة القلب.
            // لا ننفذ toggleWishlist هنا مرة ثانية.
            return;
          }
          const detailsButton =
            event.target.closest(
              "[data-details-product]"
            );

          if (detailsButton) {

            const id =
              detailsButton.dataset.detailsProduct;

            const product =
              state.products.find(
                item => item.id === id
              );

            if (product) {
              openProductDetails(product);
            }
          }
        }
      );

      /* =======================================================
         SECTION FILTER EVENTS
         ======================================================= */

      sectionsBox.addEventListener(
        "click",
        event => {

          const button =
            event.target.closest(
              "[data-category]"
            );

          if (!button) {
            return;
          }

          state.category =
            button.dataset.category || "";

          renderSections();
          renderProducts();
        }
      );

      /* =======================================================
         SEARCH
         ======================================================= */

      let searchTimer = null;

      searchInput.addEventListener(
        "input",
        () => {

          clearTimeout(searchTimer);

          searchTimer =
            setTimeout(() => {

              state.query =
                searchInput.value || "";

              renderProducts();

            }, 70);
        }
      );

      /* =======================================================
         URL PARAMETERS
         ======================================================= */

      function readURLFilters() {
        try {
          const params =
            new URLSearchParams(
              window.location.search
            );

          const query =
            params.get("q");

          const category =
            params.get("category");

          if (query) {
            state.query = query;
            searchInput.value = query;
          }

          if (category) {
            state.category = category;
          }

        } catch (_) {}
      }

      /* =======================================================
         CART BUTTON
         ======================================================= */

      $("#catalogCartButton")
        .addEventListener(
          "click",
          () => {

            const features =
              getFeatures();

            if (
              features &&
              typeof features.openCart === "function"
            ) {
              features.openCart();
              return;
            }

            if (
              features &&
              typeof features.toggleCart === "function"
            ) {
              features.toggleCart();
            }
          }
        );

      /* =======================================================
         INITIAL LOAD
         ======================================================= */

      async function boot() {

        readURLFilters();

        /*
         * First render from cache immediately.
         */

        const cached =
          readCache();

        if (cached?.data) {

          applyData(
            cached.data
          );

          /*
           * Fresh background refresh
           * only when cache is old.
           */

          if (
            Date.now() -
            cached.time >
            CACHE_TTL
          ) {
            fetchCatalog();
          }

        } else {

          /*
           * No cache:
           * make the only required request.
           */

          await fetchCatalog();

        }

        /*
         * If features.js loads after this page,
         * we intentionally do not issue another
         * Apps Script request.
         */

        state.ready = true;
      }

      boot();

      /* =======================================================
         ONLINE RECOVERY
         ======================================================= */

      window.addEventListener(
        "online",
        () => {

          if (!state.products.length) {
            fetchCatalog();
          }

        },
        { passive: true }
      );

      /* =======================================================
         VISIBILITY
         Do NOT fetch on every tab switch.
         Only refresh if cache is old.
         ======================================================= */

      document.addEventListener(
        "visibilitychange",
        () => {

          if (
            document.visibilityState !==
            "visible"
          ) {
            return;
          }

          const cached =
            readCache();

          if (
            cached &&
            Date.now() - cached.time <
              CACHE_TTL
          ) {
            return;
          }

          fetchCatalog();

        }
      );

    })();
  </script>
