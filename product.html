<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">

  <meta name="viewport"
        content="width=device-width,initial-scale=1,viewport-fit=cover">

  <meta name="theme-color" content="#071321">

  <title>المنتج | أبو طارق للأدوات المنزلية</title>

  <meta name="description"
        content="تفاصيل المنتج من أبو طارق للأدوات المنزلية في الإسكندرية.">

  <meta name="robots" content="index,follow">

  <link rel="icon"
        type="image/png"
        href="./assets/logo.png">

  <link rel="apple-touch-icon"
        href="./assets/logo.png">

  <link rel="canonical"
        href="https://abotarek963258-cmyk.github.io/abo-tarek-store/product.html">

  <link rel="preconnect"
        href="https://fonts.googleapis.com">

  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

  <link rel="dns-prefetch"
        href="//script.google.com">

  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap">

  <link rel="stylesheet"
        href="./style.css?v=6000">

  <link rel="stylesheet"
        href="./features.css?v=6000">

  <style>

    /* =========================================================
       ABO TAREK PRODUCT PAGE
       DARK NAVY LUXURY
       ========================================================= */

    :root {
      --pt-navy: #071321;
      --pt-navy-2: #0b1c2d;
      --pt-navy-3: #10263b;

      --pt-cream: #f7f1e4;
      --pt-cream-2: #eee5d4;

      --pt-gold: #d4af37;
      --pt-gold-light: #e2c45b;

      --pt-muted: #aeb9c4;
      --pt-border: rgba(212,175,55,.17);

      --pt-shadow:
        0 20px 55px rgba(0,0,0,.25);
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--pt-navy);
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 85% 0%,
          rgba(212,175,55,.07),
          transparent 30%
        ),
        var(--pt-navy);

      color: var(--pt-cream);

      font-family:
        "Cairo",
        system-ui,
        sans-serif;
    }

    button,
    input {
      font-family: inherit;
    }

    img {
      max-width: 100%;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================================================
       TOP STRIP
       ========================================================= */

    .pt-top-strip {
      min-height: 34px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 6px 14px;

      background:
        linear-gradient(
          90deg,
          #071321,
          #10263b,
          #071321
        );

      border-bottom:
        1px solid rgba(212,175,55,.12);

      color: var(--pt-cream);

      font-size: 12px;
      font-weight: 600;

      text-align: center;
    }

    /* =========================================================
       HEADER
       ========================================================= */

    .pt-header {
      position: sticky;
      top: 0;
      z-index: 100;

      background:
        rgba(7,19,33,.94);

      border-bottom:
        1px solid rgba(212,175,55,.14);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .pt-header-inner {
      width:
        min(1240px, calc(100% - 28px));

      min-height: 72px;

      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;
    }

    .pt-brand {
      display: flex;
      align-items: center;
      gap: 10px;

      min-width: 0;
    }

    .pt-logo {
      width: 46px;
      height: 46px;

      flex: 0 0 46px;

      object-fit: contain;

      padding: 5px;

      background: var(--pt-cream);

      border-radius: 12px;

      box-shadow:
        0 7px 20px rgba(0,0,0,.2);
    }

    .pt-brand-name {
      color: var(--pt-cream);

      font-size: 16px;
      font-weight: 800;

      white-space: nowrap;
    }

    .pt-brand-sub {
      margin-top: 2px;

      color: var(--pt-gold);

      font-size: 10px;
      font-weight: 600;
    }

    .pt-header-actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .pt-header-btn {
      min-width: 42px;
      height: 42px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      padding: 0 12px;

      border:
        1px solid rgba(212,175,55,.18);

      border-radius: 12px;

      background:
        rgba(255,255,255,.035);

      color: var(--pt-cream);

      cursor: pointer;

      font-size: 12px;
      font-weight: 700;

      transition:
        .18s ease;
    }

    .pt-header-btn:hover {
      background:
        rgba(212,175,55,.09);

      border-color:
        rgba(212,175,55,.4);

      transform:
        translateY(-1px);
    }

    /* =========================================================
       PAGE
       ========================================================= */

    .pt-page {
      width:
        min(1180px, calc(100% - 28px));

      margin: auto;

      padding:
        22px 0 60px;
    }

    /* =========================================================
       BREADCRUMB
       ========================================================= */

    .pt-breadcrumb {
      display: flex;
      align-items: center;
      gap: 7px;

      margin-bottom: 18px;

      color: #8f9ba6;

      font-size: 11px;

      overflow: hidden;
      white-space: nowrap;
    }

    .pt-breadcrumb a {
      color: var(--pt-gold);
    }

    .pt-breadcrumb span:last-child {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* =========================================================
       PRODUCT AREA
       ========================================================= */

    .pt-product {
      display: grid;

      grid-template-columns:
        minmax(0, 1.05fr)
        minmax(0, .95fr);

      gap: 28px;

      align-items: start;
    }

    /* =========================================================
       GALLERY
       ========================================================= */

    .pt-gallery {
      min-width: 0;
    }

    .pt-main-image {
      position: relative;

      width: 100%;
      height: min(520px, 48vw);

      min-height: 350px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      border:
        1px solid rgba(212,175,55,.16);

      border-radius: 22px;

      background: var(--pt-cream);

      box-shadow:
        var(--pt-shadow);
    }

    .pt-main-image img {
      width: 100%;
      height: 100%;

      padding: 28px;

      object-fit: contain;
      object-position: center;

      background: var(--pt-cream);

      transition:
        opacity .18s ease;
    }

    .pt-offer-badge {
      position: absolute;

      top: 15px;
      right: 15px;

      z-index: 3;

      padding: 6px 11px;

      border-radius: 999px;

      background: var(--pt-gold);

      color: var(--pt-navy);

      font-size: 11px;
      font-weight: 900;

      box-shadow:
        0 8px 18px rgba(0,0,0,.18);
    }

    .pt-gallery-wishlist {
      position: absolute;

      top: 13px;
      left: 13px;

      z-index: 3;

      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      border:
        1px solid rgba(7,19,33,.12);

      border-radius: 50%;

      background:
        rgba(247,241,228,.93);

      color: var(--pt-navy);

      cursor: pointer;

      font-size: 19px;

      box-shadow:
        0 7px 18px rgba(0,0,0,.15);
    }

    .pt-thumbnails {
      display: flex;
      gap: 8px;

      margin-top: 10px;

      overflow-x: auto;

      padding: 2px 1px 5px;

      scrollbar-width: thin;
    }

    .pt-thumbnail {
      flex: 0 0 70px;

      width: 70px;
      height: 70px;

      padding: 4px;

      border:
        1px solid rgba(212,175,55,.15);

      border-radius: 11px;

      background: var(--pt-cream);

      cursor: pointer;

      overflow: hidden;

      transition:
        border-color .18s ease,
        transform .18s ease;
    }

    .pt-thumbnail:hover {
      transform: translateY(-1px);
    }

    .pt-thumbnail.active {
      border-color:
        var(--pt-gold);

      box-shadow:
        0 0 0 2px
        rgba(212,175,55,.1);
    }

    .pt-thumbnail img {
      width: 100%;
      height: 100%;

      object-fit: contain;

      background: var(--pt-cream);
    }

    /* =========================================================
       INFO
       ========================================================= */

    .pt-info {
      min-width: 0;

      padding: 5px 0;
    }

    .pt-category {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      margin-bottom: 8px;

      color: var(--pt-gold);

      font-size: 12px;
      font-weight: 800;
    }

    .pt-category::before {
      content: "";

      width: 22px;
      height: 1px;

      background:
        var(--pt-gold);
    }

    .pt-title {
      margin: 0;

      color: var(--pt-cream);

      font-size:
        clamp(27px, 4vw, 43px);

      line-height: 1.3;

      font-weight: 800;
    }

    .pt-description {
      margin:
        13px 0 0;

      color: var(--pt-muted);

      font-size: 13px;

      line-height: 2;
    }

    /* =========================================================
       PRICE
       ========================================================= */

    .pt-price-box {
      display: flex;
      align-items: center;
      flex-wrap: wrap;

      gap: 10px;

      margin-top: 20px;

      padding:
        15px 17px;

      border:
        1px solid rgba(212,175,55,.16);

      border-radius: 15px;

      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,.045),
          rgba(255,255,255,.02)
        );
    }

    .pt-price {
      color: var(--pt-gold);

      font-size: 25px;
      font-weight: 900;
    }

    .pt-old-price {
      color: #7e8993;

      font-size: 13px;

      text-decoration:
        line-through;
    }

    .pt-price-note {
      width: 100%;

      color: #8d99a4;

      font-size: 10px;
    }

    /* =========================================================
       QUANTITY
       ========================================================= */

    .pt-quantity-wrap {
      margin-top: 17px;
    }

    .pt-label {
      display: block;

      margin-bottom: 7px;

      color: var(--pt-cream);

      font-size: 12px;
      font-weight: 800;
    }

    .pt-quantity {
      width: 145px;

      display: grid;

      grid-template-columns:
        40px 1fr 40px;

      overflow: hidden;

      border:
        1px solid rgba(212,175,55,.2);

      border-radius: 12px;

      background:
        rgba(255,255,255,.035);
    }

    .pt-quantity button {
      height: 43px;

      border: 0;

      background:
        rgba(212,175,55,.07);

      color: var(--pt-gold);

      cursor: pointer;

      font-size: 19px;
      font-weight: 800;
    }

    .pt-quantity input {
      width: 100%;

      min-width: 0;

      border: 0;

      outline: 0;

      background: transparent;

      color: var(--pt-cream);

      text-align: center;

      font-size: 14px;
      font-weight: 800;
    }

    /* =========================================================
       ACTIONS
       ========================================================= */

    .pt-actions {
      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        minmax(0, 1fr);

      gap: 9px;

      margin-top: 17px;
    }

    .pt-action {
      min-height: 49px;

      border-radius: 13px;

      cursor: pointer;

      font-size: 12px;
      font-weight: 800;

      transition:
        .18s ease;
    }

    .pt-add {
      border:
        1px solid var(--pt-gold);

      background:
        var(--pt-gold);

      color:
        var(--pt-navy);
    }

    .pt-add:hover {
      background:
        var(--pt-gold-light);

      transform:
        translateY(-1px);
    }

    .pt-whatsapp {
      border:
        1px solid rgba(212,175,55,.2);

      background:
        rgba(255,255,255,.035);

      color:
        var(--pt-cream);
    }

    .pt-whatsapp:hover {
      background:
        rgba(212,175,55,.09);

      border-color:
        rgba(212,175,55,.4);

      transform:
        translateY(-1px);
    }

    .pt-back {
      width: 100%;

      min-height: 45px;

      margin-top: 9px;

      border:
        1px solid rgba(212,175,55,.14);

      border-radius: 12px;

      background:
        transparent;

      color:
        #aeb9c4;

      cursor: pointer;

      font-size: 11px;
      font-weight: 700;
    }

    .pt-back:hover {
      color: var(--pt-cream);
      background:
        rgba(255,255,255,.03);
    }

    /* =========================================================
       TRUST
       ========================================================= */

    .pt-trust {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 8px;

      margin-top: 17px;
    }

    .pt-trust-item {
      padding: 10px 8px;

      border:
        1px solid rgba(212,175,55,.1);

      border-radius: 11px;

      background:
        rgba(255,255,255,.025);

      text-align: center;

      color: #9ba6b0;

      font-size: 9px;

      line-height: 1.6;
    }

    .pt-trust-item strong {
      display: block;

      margin-bottom: 2px;

      color: var(--pt-gold);

      font-size: 13px;
    }

    /* =========================================================
       RELATED
       ========================================================= */

    .pt-related {
      margin-top: 52px;
    }

    .pt-related-head {
      display: flex;
      align-items: end;
      justify-content: space-between;

      gap: 12px;

      margin-bottom: 15px;
    }

    .pt-related-head h2 {
      margin: 0;

      color: var(--pt-cream);

      font-size: 21px;
      font-weight: 800;
    }

    .pt-related-head span {
      color: var(--pt-gold);

      font-size: 10px;
      font-weight: 700;
    }

    .pt-related-grid {
      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 13px;
    }

    .pt-related-card {
      overflow: hidden;

      border:
        1px solid rgba(212,175,55,.12);

      border-radius: 15px;

      background:
        rgba(255,255,255,.03);

      cursor: pointer;

      transition:
        .18s ease;
    }

    .pt-related-card:hover {
      transform:
        translateY(-2px);

      border-color:
        rgba(212,175,55,.3);
    }

    .pt-related-image {
      width: 100%;
      height: 150px;

      background: var(--pt-cream);

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pt-related-image img {
      width: 100%;
      height: 100%;

      padding: 11px;

      object-fit: contain;
    }

    .pt-related-body {
      padding: 9px 10px 11px;
    }

    .pt-related-name {
      color: var(--pt-cream);

      font-size: 11px;
      font-weight: 800;

      line-height: 1.5;

      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;

      overflow: hidden;

      min-height: 33px;
    }

    .pt-related-price {
      margin-top: 5px;

      color: var(--pt-gold);

      font-size: 11px;
      font-weight: 900;
    }

    /* =========================================================
       LOADING
       ========================================================= */

    .pt-loading {
      min-height: 430px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: var(--pt-gold);

      font-size: 14px;
      font-weight: 800;
    }

    .pt-spinner {
      width: 25px;
      height: 25px;

      margin-left: 9px;

      border:
        2px solid rgba(212,175,55,.18);

      border-top-color:
        var(--pt-gold);

      border-radius: 50%;

      animation:
        ptSpin .7s linear infinite;
    }

    @keyframes ptSpin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================================================
       ERROR
       ========================================================= */

    .pt-error {
      min-height: 430px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 30px;

      text-align: center;
    }

    .pt-error-icon {
      margin-bottom: 8px;

      font-size: 36px;
    }

    .pt-error h1 {
      margin: 0;

      color: var(--pt-cream);

      font-size: 20px;
    }

    .pt-error p {
      margin: 7px 0 17px;

      color: var(--pt-muted);

      font-size: 12px;
    }

    .pt-error a {
      padding: 10px 17px;

      border-radius: 11px;

      background: var(--pt-gold);

      color: var(--pt-navy);

      font-size: 11px;
      font-weight: 800;
    }

    /* =========================================================
       FOOTER
       ========================================================= */

    .pt-footer {
      margin-top: 50px;

      padding-top: 20px;

      border-top:
        1px solid rgba(212,175,55,.11);

      text-align: center;

      color: #7f8b96;

      font-size: 10px;
    }

    .pt-footer strong {
      color: var(--pt-gold);
    }

    /* =========================================================
       RESPONSIVE
       ========================================================= */

    @media (max-width: 950px) {

      .pt-product {
        grid-template-columns:
          1fr;
      }

      .pt-main-image {
        height: min(520px, 75vw);
      }

      .pt-info {
        padding: 0;
      }

      .pt-related-grid {
        grid-template-columns:
          repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 700px) {

      .pt-page {
        width:
          min(100% - 18px, 680px);

        padding-top: 17px;
      }

      .pt-header-inner {
        width:
          calc(100% - 18px);

        min-height: 64px;
      }

      .pt-logo {
        width: 42px;
        height: 42px;
        flex-basis: 42px;
      }

      .pt-brand-name {
        font-size: 13px;
      }

      .pt-brand-sub {
        font-size: 9px;
      }

      .pt-main-image {
        min-height: 280px;
        height: 72vw;

        border-radius: 17px;
      }

      .pt-main-image img {
        padding: 18px;
      }

      .pt-title {
        font-size: 27px;
      }

      .pt-description {
        font-size: 12px;
      }

      .pt-actions {
        grid-template-columns:
          1fr;
      }

      .pt-trust {
        grid-template-columns:
          repeat(3, 1fr);
      }

      .pt-related-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));

        gap: 9px;
      }

      .pt-related-image {
        height: 135px;
      }
    }

    @media (max-width: 420px) {

      .pt-header-btn {
        min-width: 39px;
        height: 39px;
        padding: 0 9px;
      }

      .pt-main-image {
        min-height: 250px;
      }

      .pt-thumbnail {
        flex-basis: 62px;
        width: 62px;
        height: 62px;
      }

      .pt-price {
        font-size: 21px;
      }

      .pt-trust-item {
        font-size: 8px;
      }

      .pt-related-image {
        height: 120px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }

    }

  </style>
</head>

<body>

  <div class="pt-top-strip">
    ✦ أبو طارق للأدوات المنزلية — كل اللي بيتك محتاجه في مكان واحد
  </div>

  <header class="pt-header">

    <div class="pt-header-inner">

      <a
        class="pt-brand"
        href="./index.html"
        aria-label="أبو طارق للأدوات المنزلية">

        <img
          class="pt-logo"
          src="./assets/logo.png"
          width="46"
          height="46"
          alt="أبو طارق للأدوات المنزلية"
          loading="eager"
          decoding="async">

        <div>
          <div class="pt-brand-name">
            أبو طارق للأدوات المنزلية
          </div>

          <div class="pt-brand-sub">
            الإسكندرية
          </div>
        </div>

      </a>

      <div class="pt-header-actions">

        <a
          class="pt-header-btn"
          href="./sections.html"
          aria-label="كل الأصناف">

          🛍️

        </a>

        <button
          id="productCartButton"
          class="pt-header-btn"
          type="button"
          aria-label="السلة">

          🛒

        </button>

      </div>

    </div>

  </header>

  <main class="pt-page">

    <nav
      id="productBreadcrumb"
      class="pt-breadcrumb"
      aria-label="مسار الصفحة">

      <a href="./index.html">
        الرئيسية
      </a>

      <span>›</span>

      <a href="./sections.html">
        كل الأصناف
      </a>

      <span>›</span>

      <span>
        المنتج
      </span>

    </nav>

    <div id="productRoot">

      <div class="pt-loading">
        <span class="pt-spinner"></span>
        جاري تحميل المنتج...
      </div>

    </div>

    <section
      id="relatedSection"
      class="pt-related"
      hidden>

      <div class="pt-related-head">

        <h2>
          منتجات ممكن تعجبك
        </h2>

        <span>
          من نفس القسم
        </span>

      </div>

      <div
        id="relatedGrid"
        class="pt-related-grid">
      </div>

    </section>

    <footer class="pt-footer">

      <strong>
        أبو طارق للأدوات المنزلية
      </strong>

      — الإسكندرية

    </footer>

  </main>

  <!--
    IMPORTANT:
    app.js is NOT loaded here.
    This page handles its own single public data request.
  -->

  <script src="./config.js?v=6000"></script>
  <script src="./features.js?v=6000" defer></script>

  <script>
    (() => {

      "use strict";

      /* =======================================================
         CONFIG
         ======================================================= */

      const DATA_URL =
        "https://script.google.com/macros/s/AKfycbycQxcL3WeELjc-YQ6EY86X-QZXUtWKLH2WHz_CDoRY72SIhd5mBRQBUVhVuA-AfgME/exec";

      const CACHE_KEY =
        "abo_tarek_catalog_v10";

      const CACHE_TTL =
        30 * 60 * 1000;

      const WHATSAPP_NUMBER =
        "201551604163";

      const root =
        document.getElementById(
          "productRoot"
        );

      const relatedSection =
        document.getElementById(
          "relatedSection"
        );

      const relatedGrid =
        document.getElementById(
          "relatedGrid"
        );

      const breadcrumb =
        document.getElementById(
          "productBreadcrumb"
        );

      const state = {
        products: [],
        sections: [],
        settings: {},
        product: null,
        quantity: 1
      };

      /* =======================================================
         HELPERS
         ======================================================= */

      function escapeHTML(value) {

        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");

      }

      function toBool(value) {

        if (
          value === true ||
          value === 1 ||
          value === "1"
        ) {
          return true;
        }

        return [
          "true",
          "yes",
          "on",
          "نعم",
          "فعال",
          "نشط"
        ].includes(
          String(value ?? "")
            .trim()
            .toLowerCase()
        );

      }

      function toNumber(value) {

        if (
          value === null ||
          value === undefined ||
          value === ""
        ) {
          return null;
        }

        const normalized =
          String(value)
            .replace(/,/g, "")
            .replace(/[^\d.-]/g, "");

        if (!normalized) {
          return null;
        }

        const number =
          Number(normalized);

        return Number.isFinite(number)
          ? number
          : null;

      }

      function formatPrice(value) {

        const number =
          Number(value);

        if (!Number.isFinite(number)) {
          return "";
        }

        try {

          return (
            new Intl.NumberFormat("ar-EG")
              .format(number)
            + " ج.م"
          );

        } catch (_) {

          return number + " ج.م";

        }

      }

      function getQueryId() {

        try {

          const params =
            new URLSearchParams(
              window.location.search
            );

          return (
            params.get("id") ||
            params.get("product") ||
            ""
          ).trim();

        } catch (_) {

          return "";

        }

      }

      /* =======================================================
         PRODUCT NORMALIZATION
         ======================================================= */

      function normalizeProduct(raw) {

        if (!raw) {
          return null;
        }

        const product = {

          id:
            String(raw.id ?? ""),

          name:
            String(raw.name ?? "منتج"),

          category:
            String(raw.category ?? ""),

          image:
            String(raw.image ?? ""),

          description:
            String(raw.description ?? ""),

          active:
            toBool(raw.active),

          showHome:
            toBool(raw.showHome),

          isOffer:
            toBool(raw.isOffer),

          sortOrder:
            toNumber(raw.sortOrder) ??
            999999,

          price:
            toNumber(raw.price),

          oldPrice:
            toNumber(raw.oldPrice),

          offerPrice:
            toNumber(raw.offerPrice),

          images: []

        };

        let images = [];

        if (Array.isArray(raw.images)) {

          images =
            raw.images;

        } else if (
          typeof raw.images === "string"
        ) {

          try {

            const parsed =
              JSON.parse(raw.images);

            if (Array.isArray(parsed)) {
              images = parsed;
            }

          } catch (_) {

            images =
              raw.images
                .split(/\r?\n|,/)
                .map(x => x.trim())
                .filter(Boolean);

          }

        }

        if (product.image) {
          images.unshift(
            product.image
          );
        }

        product.images =
          [...new Set(
            images
              .map(x =>
                String(x || "").trim()
              )
              .filter(Boolean)
          )].slice(0, 5);

        if (
          !product.image &&
          product.images[0]
        ) {
          product.image =
            product.images[0];
        }

        return product;
      }

      /* =======================================================
         CACHE
         ======================================================= */

      function readCache() {

        try {

          const raw =
            localStorage.getItem(
              CACHE_KEY
            );

          if (!raw) {
            return null;
          }

          const cached =
            JSON.parse(raw);

          if (
            !cached ||
            !cached.data
          ) {
            return null;
          }

          return cached;

        } catch (_) {

          return null;

        }

      }

      function saveCache(data) {

        try {

          localStorage.setItem(
            CACHE_KEY,
            JSON.stringify({
              time: Date.now(),
              data
            })
          );

        } catch (_) {}

      }

      /* =======================================================
         APPLY DATA
         ======================================================= */

      function applyData(payload) {

        state.products =
          Array.isArray(payload?.products)
            ? payload.products
                .map(normalizeProduct)
                .filter(Boolean)
                .filter(p => p.active)
                .sort(
                  (a,b) =>
                    a.sortOrder -
                    b.sortOrder
                )
            : [];

        state.sections =
          Array.isArray(payload?.sections)
            ? payload.sections
                .map(section => ({
                  id:
                    String(
                      section.id ?? ""
                    ),

                  name:
                    String(
                      section.name ?? ""
                    ),

                  active:
                    toBool(
                      section.active
                    ),

                  sortOrder:
                    toNumber(
                      section.sortOrder
                    ) ?? 999999
                }))
                .filter(
                  section =>
                    section.active
                )
                .sort(
                  (a,b) =>
                    a.sortOrder -
                    b.sortOrder
                )
            : [];

        state.settings =
          payload?.settings || {};

      }

      /* =======================================================
         FETCH
         ======================================================= */

      async function fetchCatalog() {

        const response =
          await fetch(
            DATA_URL,
            {
              method: "GET",
              cache: "no-store"
            }
          );

        if (!response.ok) {
          throw new Error(
            "HTTP " +
            response.status
          );
        }

        const payload =
          await response.json();

        if (
          !payload ||
          payload.ok === false
        ) {
          throw new Error(
            payload?.error ||
            "catalog_request_failed"
          );
        }

        saveCache(payload);

        applyData(payload);

        return payload;

      }

      /* =======================================================
         FIND PRODUCT
         ======================================================= */

      function findProduct(id) {

        return state.products.find(
          product =>
            String(product.id) ===
            String(id)
        );

      }

      /* =======================================================
         IMAGE GALLERY
         ======================================================= */

      function renderGallery(product) {

        const images =
          product.images.length
            ? product.images
            : [
                product.image ||
                "./assets/logo.png"
              ];

        return `

          <div class="pt-gallery">

            <div class="pt-main-image">

              ${
                product.isOffer
                  ? `
                    <span class="pt-offer-badge">
                      عرض خاص
                    </span>
                  `
                  : ""
              }

              <button
                type="button"
                id="productWishlist"
                class="pt-gallery-wishlist"
                aria-label="إضافة للمفضلة">

                ♡

              </button>

              <img
                id="productMainImage"
                src="${escapeHTML(images[0])}"
                alt="${escapeHTML(product.name)}"
                width="700"
                height="520"
                loading="eager"
                decoding="async"
                onerror="this.onerror=null;this.src='./assets/logo.png';">

            </div>

            ${
              images.length > 1
                ? `
                  <div
                    class="pt-thumbnails"
                    id="productThumbnails">

                    ${images.map(
                      (image, index) => `
                        <button
                          type="button"
                          class="pt-thumbnail ${index === 0 ? "active" : ""}"
                          data-gallery-image="${escapeHTML(image)}">

                          <img
                            src="${escapeHTML(image)}"
                            alt="${escapeHTML(product.name)} ${index + 1}"
                            width="70"
                            height="70"
                            loading="lazy"
                            decoding="async"
                            onerror="this.onerror=null;this.src='./assets/logo.png';">

                        </button>
                      `
                    ).join("")}

                  </div>
                `
                : ""
            }

          </div>

        `;

      }

      /* =======================================================
         PRICE
         ======================================================= */

      function renderPrice(product) {

        let mainPrice =
          null;

        let oldPrice =
          null;

        if (
          product.isOffer &&
          product.offerPrice !== null
        ) {

          mainPrice =
            product.offerPrice;

          oldPrice =
            product.oldPrice ??
            product.price;

        } else if (
          product.price !== null
        ) {

          mainPrice =
            product.price;

          oldPrice =
            product.oldPrice;

        } else if (
          product.offerPrice !== null
        ) {

          mainPrice =
            product.offerPrice;

          oldPrice =
            product.oldPrice;

        }

        if (mainPrice === null) {

          return `
            <div class="pt-price-box">

              <span class="pt-price">
                السعر عند الطلب
              </span>

              <span class="pt-price-note">
                تواصل معنا لمعرفة السعر الحالي.
              </span>

            </div>
          `;

        }

        return `
          <div class="pt-price-box">

            <span class="pt-price">
              ${formatPrice(mainPrice)}
            </span>

            ${
              oldPrice !== null &&
              oldPrice > mainPrice
                ? `
                  <span class="pt-old-price">
                    ${formatPrice(oldPrice)}
                  </span>
                `
                : ""
            }

          </div>
        `;

      }

      /* =======================================================
         INFO
         ======================================================= */

      function renderInfo(product) {

        return `

          <div class="pt-info">

            <div class="pt-category">
              ${escapeHTML(
                product.category ||
                "أبو طارق"
              )}
            </div>

            <h1 class="pt-title">
              ${escapeHTML(
                product.name
              )}
            </h1>

            ${
              product.description
                ? `
                  <p class="pt-description">
                    ${escapeHTML(
                      product.description
                    )}
                  </p>
                `
                : ""
            }

            ${renderPrice(product)}

            <div class="pt-quantity-wrap">

              <label
                class="pt-label"
                for="productQuantity">

                الكمية

              </label>

              <div class="pt-quantity">

                <button
                  type="button"
                  id="quantityMinus"
                  aria-label="تقليل الكمية">

                  −

                </button>

                <input
                  id="productQuantity"
                  type="number"
                  value="1"
                  min="1"
                  max="99"
                  inputmode="numeric"
                  aria-label="كمية المنتج">

                <button
                  type="button"
                  id="quantityPlus"
                  aria-label="زيادة الكمية">

                  +

                </button>

              </div>

            </div>

            <div class="pt-actions">

              <button
                type="button"
                id="productAddToCart"
                class="pt-action pt-add">

                🛒 إضافة للسلة

              </button>

              <button
                type="button"
                id="productWhatsApp"
                class="pt-action pt-whatsapp">

                💬 طلب عبر واتساب

              </button>

            </div>

            <button
              type="button"
              id="productBack"
              class="pt-back">

              ← الرجوع لكل الأصناف

            </button>

            <div class="pt-trust">

              <div class="pt-trust-item">
                <strong>✓</strong>
                اختيار مميز للبيت
              </div>

              <div class="pt-trust-item">
                <strong>✦</strong>
                أبو طارق
              </div>

              <div class="pt-trust-item">
                <strong>📍</strong>
                الإسكندرية
              </div>

            </div>

          </div>

        `;

      }

      /* =======================================================
         RELATED PRODUCTS
         ======================================================= */

      function renderRelated(product) {

        const related =
          state.products
            .filter(
              item =>
                item.id !== product.id &&
                item.category ===
                  product.category
            )
            .slice(0, 4);

        if (!related.length) {

          relatedSection.hidden =
            true;

          return;

        }

        relatedSection.hidden =
          false;

        relatedGrid.innerHTML =
          related.map(item => {

            const image =
              item.image ||
              "./assets/logo.png";

            const price =
              item.isOffer &&
              item.offerPrice !== null
                ? item.offerPrice
                : item.price;

            return `

              <a
                class="pt-related-card"
                href="./product.html?id=${encodeURIComponent(item.id)}">

                <div class="pt-related-image">

                  <img
                    src="${escapeHTML(image)}"
                    alt="${escapeHTML(item.name)}"
                    width="300"
                    height="150"
                    loading="lazy"
                    decoding="async"
                    onerror="this.onerror=null;this.src='./assets/logo.png';">

                </div>

                <div class="pt-related-body">

                  <div class="pt-related-name">
                    ${escapeHTML(item.name)}
                  </div>

                  ${
                    price !== null
                      ? `
                        <div class="pt-related-price">
                          ${formatPrice(price)}
                        </div>
                      `
                      : ""
                  }

                </div>

              </a>

            `;

          }).join("");

      }

      /* =======================================================
         RENDER PRODUCT
         ======================================================= */

      function renderProduct(product) {

        if (!product) {

          root.innerHTML = `

            <div class="pt-error">

              <div class="pt-error-icon">
                🔎
              </div>

              <h1>
                المنتج غير موجود
              </h1>

              <p>
                المنتج المطلوب مش متاح حاليًا.
              </p>

              <a href="./sections.html">
                العودة لكل الأصناف
              </a>

            </div>

          `;

          relatedSection.hidden =
            true;

          return;

        }

        state.product =
          product;

        document.title =
          `${product.name} | أبو طارق للأدوات المنزلية`;

        const metaDescription =
          document.querySelector(
            'meta[name="description"]'
          );

        if (metaDescription) {

          metaDescription.setAttribute(
            "content",
            product.description
              ? `${product.name} — ${product.description} | أبو طارق للأدوات المنزلية`
              : `${product.name} | أبو طارق للأدوات المنزلية في الإسكندرية`
          );

        }

        const canonical =
          document.querySelector(
            'link[rel="canonical"]'
          );

        if (canonical) {

          canonical.href =
            window.location.href
              .split("#")[0];

        }

        breadcrumb.innerHTML = `

          <a href="./index.html">
            الرئيسية
          </a>

          <span>›</span>

          <a
            href="./sections.html?category=${encodeURIComponent(product.category)}">

            ${escapeHTML(
              product.category ||
              "كل الأصناف"
            )}

          </a>

          <span>›</span>

          <span>
            ${escapeHTML(product.name)}
          </span>

        `;

        root.innerHTML = `

          <section class="pt-product">

            ${renderGallery(product)}

            ${renderInfo(product)}

          </section>

        `;

        renderRelated(product);

        bindProductEvents();

      }

      /* =======================================================
         FEATURES BRIDGE
         ======================================================= */

      function getFeatures() {

        return (
          window.ABO_TAREK_FEATURES ||
          null
        );

      }

      function addToCart() {

        if (!state.product) {
          return;
        }

        const features =
          getFeatures();

        /*
         * features.js owns the cart.
         * We send one call only.
         */

        if (
          features &&
          typeof features.addToCart ===
            "function"
        ) {

          features.addToCart(
            state.product,
            state.quantity
          );

          return;

        }

        document.dispatchEvent(
          new CustomEvent(
            "abo:tarek:add-to-cart",
            {
              detail: {
                product:
                  state.product,

                quantity:
                  state.quantity
              }
            }
          )
        );

      }

      function toggleWishlist() {

        if (!state.product) {
          return;
        }

        const features =
          getFeatures();

        if (
          features &&
          typeof features.toggleWishlist ===
            "function"
        ) {

          features.toggleWishlist(
            state.product
          );

          return;

        }

        if (
          features &&
          typeof features.addToWishlist ===
            "function"
        ) {

          features.addToWishlist(
            state.product
          );

        }

      }

      function openCart() {

        const features =
          getFeatures();

        if (
          features &&
          typeof features.openCart ===
            "function"
        ) {

          features.openCart();
          return;

        }

        if (
          features &&
          typeof features.toggleCart ===
            "function"
        ) {

          features.toggleCart();

        }

      }

      /* =======================================================
         WHATSAPP
         ======================================================= */

      function openWhatsApp() {

        if (!state.product) {
          return;
        }

        const quantity =
          Math.max(
            1,
            Math.min(
              99,
              Number(
                state.quantity
              ) || 1
            )
          );

        let priceText =
          "";

        if (
          state.product.isOffer &&
          state.product.offerPrice !== null
        ) {

          priceText =
            formatPrice(
              state.product.offerPrice
            );

        } else if (
          state.product.price !== null
        ) {

          priceText =
            formatPrice(
              state.product.price
            );

        }

        const message =
          [
            "مرحبًا أبو طارق 👋",
            "",
            "أرغب في طلب:",
            `المنتج: ${state.product.name}`,
            `الكمية: ${quantity}`,
            priceText
              ? `السعر: ${priceText}`
              : "",
            "",
            "من الموقع."
          ]
            .filter(Boolean)
            .join("\n");

        const url =
          "https://wa.me/" +
          WHATSAPP_NUMBER +
          "?text=" +
          encodeURIComponent(message);

        window.open(
          url,
          "_blank",
          "noopener"
        );

      }

      /* =======================================================
         EVENTS
         ======================================================= */

      function bindProductEvents() {

        const minus =
          document.getElementById(
            "quantityMinus"
          );

        const plus =
          document.getElementById(
            "quantityPlus"
          );

        const input =
          document.getElementById(
            "productQuantity"
          );

        const add =
          document.getElementById(
            "productAddToCart"
          );

        const whatsapp =
          document.getElementById(
            "productWhatsApp"
          );

        const wishlist =
          document.getElementById(
            "productWishlist"
          );

        const back =
          document.getElementById(
            "productBack"
          );

        if (minus) {

          minus.onclick =
            () => {

              state.quantity =
                Math.max(
                  1,
                  state.quantity - 1
                );

              if (input) {
                input.value =
                  state.quantity;
              }

            };

        }

        if (plus) {

          plus.onclick =
            () => {

              state.quantity =
                Math.min(
                  99,
                  state.quantity + 1
                );

              if (input) {
                input.value =
                  state.quantity;
              }

            };

        }

        if (input) {

          input.addEventListener(
            "input",
            () => {

              let value =
                Number(
                  input.value
                );

              if (!Number.isFinite(value)) {
                value = 1;
              }

              value =
                Math.max(
                  1,
                  Math.min(
                    99,
                    Math.floor(value)
                  )
                );

              state.quantity =
                value;

              input.value =
                value;

            }
          );

        }

        if (add) {

          add.onclick =
            () => {

              addToCart();

            };

        }

        if (whatsapp) {

          whatsapp.onclick =
            () => {

              openWhatsApp();

            };

        }

        if (wishlist) {

          wishlist.onclick =
            () => {

              toggleWishlist();

            };

        }

        if (back) {

          back.onclick =
            () => {

              window.location.href =
                "./sections.html";

            };

        }

        const thumbnails =
          document.querySelectorAll(
            "[data-gallery-image]"
          );

        thumbnails.forEach(
          thumbnail => {

            thumbnail.addEventListener(
              "click",
              () => {

                const image =
                  thumbnail.dataset
                    .galleryImage;

                const main =
                  document.getElementById(
                    "productMainImage"
                  );

                if (main && image) {

                  main.src =
                    image;

                }

                thumbnails.forEach(
                  item =>
                    item.classList.remove(
                      "active"
                    )
                );

                thumbnail.classList.add(
                  "active"
                );

              }
            );

          }
        );

      }

      /* =======================================================
         HEADER CART
         ======================================================= */

      const cartButton =
        document.getElementById(
          "productCartButton"
        );

      if (cartButton) {

        cartButton.addEventListener(
          "click",
          openCart
        );

      }

      /* =======================================================
         STRUCTURED DATA
         ======================================================= */

      function addProductSchema(product) {

        const existing =
          document.getElementById(
            "productSchema"
          );

        if (existing) {
          existing.remove();
        }

        const data = {

          "@context":
            "https://schema.org",

          "@type":
            "Product",

          name:
            product.name,

          description:
            product.description ||
            product.name,

          image:
            product.images.length
              ? product.images
              : [
                  product.image ||
                  "./assets/logo.png"
                ],

          brand: {
            "@type":
              "Brand",

            name:
              "أبو طارق"
          }

        };

        const price =
          product.isOffer &&
          product.offerPrice !== null
            ? product.offerPrice
            : product.price;

        if (price !== null) {

          data.offers = {

            "@type":
              "Offer",

            priceCurrency:
              "EGP",

            price:
              price,

            availability:
              "https://schema.org/InStock",

            url:
              window.location.href

          };

        }

        const script =
          document.createElement(
            "script"
          );

        script.id =
          "productSchema";

        script.type =
          "application/ld+json";

        script.textContent =
          JSON.stringify(data);

        document.head.appendChild(
          script
        );

      }

      /* =======================================================
         BOOT
         ======================================================= */

      async function boot() {

        const productId =
          getQueryId();

        if (!productId) {

          renderProduct(null);

          return;

        }

        /*
         * First use existing local cache.
         * This makes product pages open immediately
         * after visiting the catalog.
         */

        const cached =
          readCache();

        if (cached?.data) {

          applyData(
            cached.data
          );

          const cachedProduct =
            findProduct(
              productId
            );

          if (cachedProduct) {

            renderProduct(
              cachedProduct
            );

            addProductSchema(
              cachedProduct
            );

          }

          /*
           * Only refresh if cache is old.
           * This prevents duplicate Apps Script calls.
           */

          if (
            Date.now() -
              cached.time >
            CACHE_TTL
          ) {

            try {

              await fetchCatalog();

              const freshProduct =
                findProduct(
                  productId
                );

              renderProduct(
                freshProduct
              );

              if (freshProduct) {
                addProductSchema(
                  freshProduct
                );
              }

            } catch (error) {

              console.warn(
                "Background refresh failed:",
                error
              );

              if (!cachedProduct) {
                renderProduct(null);
              }

            }

          }

          return;

        }

        /*
         * No cache:
         * exactly one request.
         */

        try {

          await fetchCatalog();

          const product =
            findProduct(
              productId
            );

          renderProduct(product);

          if (product) {
            addProductSchema(product);
          }

        } catch (error) {

          console.error(
            "Product loading failed:",
            error
          );

          root.innerHTML = `

            <div class="pt-error">

              <div class="pt-error-icon">
                ⚠️
              </div>

              <h1>
                حصلت مشكلة في تحميل المنتج
              </h1>

              <p>
                حاول تحديث الصفحة مرة تانية.
              </p>

              <a href="./sections.html">
                العودة لكل الأصناف
              </a>

            </div>

          `;

        }

      }

      boot();

    })();
  </script>

</body>

</html>
